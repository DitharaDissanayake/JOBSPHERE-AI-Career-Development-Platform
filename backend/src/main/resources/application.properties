spring.datasource.url=jdbc:mysql://localhost:3306/jobsphere?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
server.port=8080
ollama.url=http://localhost:11434/api/generate
ollama.model=llama3.2
ollama.timeout-seconds=120
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# JOBSPHERE EMAIL CONFIGURATION
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true




# ============================================================
# JOBSPHERE ADVANCED COURSE PAYMENTS
# ============================================================
# DEMO mode validates card number/expiry/CVV and never stores
# the full card number or CVV. For real payments set PAYHERE_*.
payhere.enabled=${PAYHERE_ENABLED:false}
payhere.merchant-id=${PAYHERE_MERCHANT_ID:}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:}
payhere.sandbox=${PAYHERE_SANDBOX:true}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5500}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
