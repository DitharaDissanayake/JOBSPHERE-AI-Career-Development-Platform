<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin Center | JOBSPHERE</title>

    <link rel="stylesheet"
          href="assets/css/app.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =========================================================
           ADMIN PAGE
           ========================================================= */

        .admin-page {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
        }


        /* =========================================================
           ADMIN SIDEBAR
           IMPORTANT:
           Your app.css uses .side, NOT .sidebar
           ========================================================= */

        .side {
            display: flex !important;
            flex-direction: column !important;
            height: 100vh !important;
            min-height: 100vh !important;
            overflow-y: auto !important;
        }


        /* =========================================================
           ADMIN SIGN OUT
           ========================================================= */

        .admin-sidebar-logout {
            width: 100%;
            margin: 0;
            padding: 4px 14px 8px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .admin-sidebar-logout button {
            width: 100%;
            min-height: 44px;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 12px 14px;

            border: 0;
            border-radius: 12px;

            background: transparent;

            color: #c83e48;

            font-family: inherit;
            font-size: 14px;
            font-weight: 700;

            text-align: left;

            cursor: pointer;

            box-sizing: border-box;

            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease;
        }

        .admin-sidebar-logout button i {
            width: 18px;
            min-width: 18px;

            text-align: center;

            font-size: 14px;

            color: #c83e48;
        }

        .admin-sidebar-logout button span {
            display: inline-block;

            color: #c83e48;

            white-space: nowrap;
        }

        .admin-sidebar-logout button:hover {
            background: #fff1f2;

            color: #b52e39;

            transform: translateX(3px);
        }

        .admin-sidebar-logout button:hover i,
        .admin-sidebar-logout button:hover span {
            color: #b52e39;
        }

        .admin-sidebar-logout button:active {
            transform: translateX(1px);
        }


        /* =========================================================
           HERO
           ========================================================= */

        .admin-hero {
            position: relative;
            overflow: hidden;

            padding: 34px 38px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    #071a33 0%,
                    #0c3d78 48%,
                    #1769e0 100%
                );

            color: white;

            box-shadow:
                0 22px 55px rgba(7,45,90,.20);
        }

        .admin-hero::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,.10);

            right: -90px;
            top: -150px;
        }

        .admin-hero::after {
            content: "";

            position: absolute;

            width: 190px;
            height: 190px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.06);

            right: 150px;
            bottom: -135px;
        }

        .admin-hero-content {
            position: relative;
            z-index: 2;

            max-width: 760px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;

            gap: 8px;

            padding: 7px 12px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.12);

            border:
                1px solid rgba(255,255,255,.18);

            font-size: 10px;
            font-weight: 800;

            letter-spacing: .9px;
        }

        .admin-hero h2 {
            margin: 15px 0 8px;

            font-size: 30px;
            line-height: 1.2;

            letter-spacing: -.7px;
        }

        .admin-hero p {
            margin: 0;

            max-width: 700px;

            color: #d7e8ff;

            font-size: 13px;
            line-height: 1.7;
        }


        /* =========================================================
           STATISTICS
           ========================================================= */

        .admin-stats {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 15px;

            margin-top: 20px;
        }

        .admin-stat {
            position: relative;

            background: white;

            border:
                1px solid var(--line);

            border-radius: 18px;

            padding: 20px;

            min-height: 125px;

            box-shadow:
                0 8px 25px rgba(22,55,90,.07);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .admin-stat:hover {
            transform: translateY(-3px);

            box-shadow:
                0 14px 32px rgba(22,55,90,.11);
        }

        .admin-stat-top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;
        }

        .admin-stat-icon {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            display: grid;
            place-items: center;

            background: #edf4ff;

            color: var(--blue);

            font-size: 15px;
        }

        .admin-stat-value {
            margin-top: 17px;

            color: var(--navy);

            font-size: 27px;
            font-weight: 900;

            letter-spacing: -.5px;
        }

        .admin-stat-label {
            margin-top: 2px;

            color: var(--muted);

            font-size: 11px;
            font-weight: 700;
        }

        .admin-stat-sub {
            margin-top: 7px;

            color: #8b9aae;

            font-size: 9px;
        }


        /* =========================================================
           MAIN GRID
           ========================================================= */

        .admin-content-grid {
            display: grid;

            grid-template-columns:
                1.25fr .75fr;

            gap: 20px;

            margin-top: 20px;
        }


        /* =========================================================
           ADMIN CARD
           ========================================================= */

        .admin-card {
            background: white;

            border:
                1px solid var(--line);

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                var(--shadow);
        }

        .admin-card-header {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
        }

        .admin-card-header-left {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .admin-card-icon {
            width: 42px;
            height: 42px;

            min-width: 42px;

            border-radius: 12px;

            background: #edf4ff;

            color: var(--blue);

            display: grid;
            place-items: center;
        }

        .admin-card h3 {
            margin: 0;

            color: var(--navy);

            font-size: 18px;
        }

        .admin-card-header p {
            margin: 4px 0 0;

            color: var(--muted);

            font-size: 11px;
        }


        /* =========================================================
           MANAGEMENT
           ========================================================= */

        .management-list {
            display: grid;
            gap: 10px;
        }

        .management-item {
            display: flex;

            align-items: center;

            gap: 13px;

            padding: 14px;

            border:
                1px solid #e6edf6;

            border-radius: 13px;

            text-decoration: none;

            background: #fbfdff;

            transition: all .2s ease;
        }

        .management-item:hover {
            border-color: #cbdcf5;

            background: #f5f9ff;

            transform: translateX(3px);
        }

        .management-item-icon {
            width: 38px;
            height: 38px;

            min-width: 38px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background: #edf4ff;

            color: var(--blue);
        }

        .management-item-content {
            flex: 1;
        }

        .management-item-content strong {
            display: block;

            color: var(--navy);

            font-size: 12px;
        }

        .management-item-content span {
            display: block;

            margin-top: 3px;

            color: var(--muted);

            font-size: 10px;
        }

        .management-arrow {
            color: #9aacbf;

            font-size: 12px;
        }


        /* =========================================================
           SYSTEM STATUS
           ========================================================= */

        .status-card {
            background:
                linear-gradient(
                    145deg,
                    #f7fbff,
                    #ffffff
                );
        }

        .status-item {
            display: flex;

            align-items: center;

            gap: 11px;

            padding: 13px 0;

            border-bottom:
                1px solid #edf2f7;
        }

        .status-item:last-child {
            border-bottom: 0;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #21a366;

            box-shadow:
                0 0 0 4px rgba(33,163,102,.10);
        }

        .status-item div {
            flex: 1;
        }

        .status-item strong {
            display: block;

            color: var(--navy);

            font-size: 11px;
        }

        .status-item span {
            display: block;

            margin-top: 2px;

            color: var(--muted);

            font-size: 9px;
        }

        .status-online {
            color: #198754 !important;

            font-size: 9px !important;

            font-weight: 800;
        }


        /* =========================================================
           ADMIN INFO
           ========================================================= */

        .admin-info {
            margin-top: 20px;

            padding: 16px;

            border-radius: 14px;

            background: #f5f9ff;

            border:
                1px solid #dceaff;
        }

        .admin-info-title {
            display: flex;

            align-items: center;

            gap: 8px;

            color: var(--navy);

            font-size: 11px;

            font-weight: 800;

            margin-bottom: 6px;
        }

        .admin-info-title i {
            color: var(--blue);
        }

        .admin-info p {
            margin: 0;

            color: #667b94;

            font-size: 10px;

            line-height: 1.6;
        }


        /* =========================================================
           QUICK ACTIONS
           ========================================================= */

        .quick-actions {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 20px;
        }

        .quick-action {
            padding: 13px;

            border:
                1px solid #e4ebf4;

            border-radius: 12px;

            text-decoration: none;

            text-align: center;

            background: white;

            transition: all .2s ease;

            cursor: pointer;

            font-family: inherit;
        }

        .quick-action:hover {
            background: #f5f9ff;

            border-color: #c9dcf5;

            transform: translateY(-2px);
        }

        .quick-action i {
            display: block;

            margin-bottom: 6px;

            color: var(--blue);

            font-size: 15px;
        }

        .quick-action span {
            color: var(--navy);

            font-size: 10px;

            font-weight: 800;
        }


        /* =========================================================
           COURSE FILTER
           ========================================================= */

        .course-filter-row {
            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 18px;

            padding: 14px;

            border-radius: 14px;

            background: #f7faff;

            border:
                1px solid #e3ebf5;
        }

        .course-filter-label {
            color: var(--navy);

            font-size: 11px;

            font-weight: 800;
        }

        .course-filter-select {
            flex: 1;

            min-width: 250px;

            padding: 11px 13px;

            border:
                1px solid #d6e1ed;

            border-radius: 10px;

            background: white;

            color: var(--navy);

            font-size: 11px;

            outline: none;
        }

        .course-filter-select:focus {
            border-color: var(--blue);

            box-shadow:
                0 0 0 3px rgba(23,105,224,.08);
        }

        .filter-button {
            border: 0;

            min-width: 120px;

            background: #1769e0;

            color: white;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            padding: 11px 16px;

            border-radius: 10px;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;

            transition: all .2s ease;
        }

        .filter-button:hover {
            background: #0c57c7;

            transform: translateY(-1px);
        }

        .filter-button:disabled {
            opacity: .65;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================================
           PARTICIPANTS TABLE
           ========================================================= */

        .participants-wrapper {
            width: 100%;

            overflow-x: auto;

            border:
                1px solid #e6edf5;

            border-radius: 14px;
        }

        .participants-table {
            width: 100%;

            min-width: 850px;

            border-collapse: collapse;

            font-size: 11px;
        }

        .participants-table thead {
            background: #f7faff;
        }

        .participants-table th {
            padding: 13px 12px;

            text-align: left;

            color: #58708d;

            font-size: 9px;

            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: .4px;

            border-bottom:
                1px solid #e2eaf3;
        }

        .participants-table td {
            padding: 13px 12px;

            color: #53677e;

            border-bottom:
                1px solid #edf2f7;

            vertical-align: middle;
        }

        .participants-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .participants-table tbody tr:hover {
            background: #fbfdff;
        }

        .participant-name {
            display: block;

            color: var(--navy);

            font-weight: 800;

            font-size: 11px;
        }

        .participant-email {
            display: block;

            margin-top: 3px;

            color: #94a3b8;

            font-size: 9px;
        }

        .score-value {
            color: var(--navy);

            font-size: 13px;

            font-weight: 900;
        }

        .score-detail {
            display: block;

            margin-top: 3px;

            color: #94a3b8;

            font-size: 9px;
        }

        .course-status {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 5px 8px;

            border-radius: 999px;

            font-size: 8px;

            font-weight: 900;
        }

        .course-status.passed {
            color: #176b3a;

            background: #eaf8ef;
        }

        .course-status.failed {
            color: #a45b00;

            background: #fff4df;
        }

        .certificate-sent {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            color: #176b3a;

            background: #eaf8ef;

            padding: 6px 9px;

            border-radius: 999px;

            font-size: 8px;

            font-weight: 900;
        }

        .certificate-not-sent {
            border: 0;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            padding: 8px 10px;

            border-radius: 9px;

            background: #1769e0;

            color: white;

            font-size: 9px;

            font-weight: 800;

            cursor: pointer;

            transition: all .2s ease;
        }

        .certificate-not-sent:hover {
            background: #0c57c7;

            transform: translateY(-1px);
        }

        .certificate-not-sent:disabled {
            opacity: .65;

            cursor: not-allowed;

            transform: none;
        }

        .certificate-not-sent i {
            margin: 0;

            color: white;
        }

        .no-participants {
            padding: 45px 20px;

            text-align: center;

            color: var(--muted);

            font-size: 11px;
        }

        .no-participants i {
            display: block;

            margin-bottom: 10px;

            color: #9db0c6;

            font-size: 25px;
        }


        /* =========================================================
           LOADING
           ========================================================= */

        .admin-loading {
            grid-column: 1 / -1;

            padding: 35px;

            text-align: center;

            color: var(--muted);

            font-size: 11px;
        }

        .admin-loading i {
            margin-right: 7px;

            color: var(--blue);
        }


        /* =========================================================
           ERROR
           ========================================================= */

        .admin-error {
            padding: 18px;

            border-radius: 13px;

            background: #fff5f5;

            border:
                1px solid #ffd9dc;

            color: #b4232f;

            font-size: 10px;

            line-height: 1.6;
        }

        .admin-error i {
            margin-right: 6px;
        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 1050px) {

            .admin-stats {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }

        @media (max-width: 850px) {

            .admin-content-grid {
                grid-template-columns: 1fr;
            }

            .admin-card {
                padding: 20px;
            }

        }

        @media (max-width: 650px) {

            .admin-hero {
                padding: 27px;
            }

            .admin-hero h2 {
                font-size: 25px;
            }

            .admin-stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .course-filter-row {
                align-items: stretch;

                flex-direction: column;
            }

            .course-filter-select {
                min-width: 100%;

                width: 100%;
            }

            .filter-button {
                width: 100%;
            }

        }

        @media (max-width: 450px) {

            .admin-stats {
                grid-template-columns: 1fr;
            }

            .admin-hero {
                padding: 23px;
            }

            .admin-card {
                padding: 16px;
            }

        }

    </style>

</head>


<body>


<div class="app"
     id="app">
</div>


<script src="assets/js/app.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        /* =====================================================
           AUTHENTICATION
           ===================================================== */

        let currentUser;

        try {

            currentUser = requireUser();

        }
        catch (error) {

            console.error(
                "Authentication error:",
                error
            );

            return;

        }


        /* =====================================================
           ADMIN ACCESS
           ===================================================== */

        if (
            !currentUser ||
            currentUser.role !== "ADMIN"
        ) {

            window.location.href =
                "dashboard.html";

            return;

        }


        /* =====================================================
           PAGE
           ===================================================== */

        const app =
            document.getElementById("app");


        app.innerHTML =
            shell(
                "Admin Center",
                "admin"
            )

            +

            `

            <div class="admin-page">

                <!-- HERO -->

                <section class="admin-hero">

                    <div class="admin-hero-content">

                        <div class="admin-badge">

                            <i class="fa-solid fa-shield-halved"></i>

                            ADMINISTRATION CENTER

                        </div>


                        <h2>
                            Welcome to the JOBSPHERE Admin Center.
                        </h2>


                        <p>

                            Manage your platform from one central
                            workspace. Monitor registered users,
                            respond to support messages, review
                            feedback, manage course participation
                            and send professional certificates.

                        </p>

                    </div>

                </section>


                <!-- STATISTICS -->

                <div
                    class="admin-stats"
                    id="stats"
                >

                    <div class="admin-loading">

                        <i class="fa-solid fa-spinner fa-spin"></i>

                        Loading platform statistics...

                    </div>

                </div>


                <!-- MANAGEMENT + STATUS -->

                <div class="admin-content-grid">


                    <!-- MANAGEMENT -->

                    <section class="admin-card">

                        <div class="admin-card-header">

                            <div class="admin-card-header-left">

                                <div class="admin-card-icon">

                                    <i class="fa-solid fa-sliders"></i>

                                </div>

                                <div>

                                    <h3>
                                        Platform Management
                                    </h3>

                                    <p>
                                        Manage important JOBSPHERE operations.
                                    </p>

                                </div>

                            </div>

                        </div>


                        <div class="management-list">


                            <a
                                href="admin-users.html"
                                class="management-item"
                            >

                                <div class="management-item-icon">

                                    <i class="fa-solid fa-users"></i>

                                </div>


                                <div class="management-item-content">

                                    <strong>
                                        User Management
                                    </strong>

                                    <span>
                                        View users and manage account status.
                                    </span>

                                </div>


                                <i
                                    class="fa-solid fa-chevron-right management-arrow">
                                </i>

                            </a>


                            <a
                                href="admin-messages.html"
                                class="management-item"
                            >

                                <div class="management-item-icon">

                                    <i class="fa-solid fa-envelope"></i>

                                </div>


                                <div class="management-item-content">

                                    <strong>
                                        Contact Messages
                                    </strong>

                                    <span>
                                        Read and reply to messages from users.
                                    </span>

                                </div>


                                <i
                                    class="fa-solid fa-chevron-right management-arrow">
                                </i>

                            </a>


                            <a
                                href="admin-feedback.html"
                                class="management-item"
                            >

                                <div class="management-item-icon">

                                    <i class="fa-solid fa-star"></i>

                                </div>


                                <div class="management-item-content">

                                    <strong>
                                        Feedback & Ratings
                                    </strong>

                                    <span>
                                        Review user feedback and ratings.
                                    </span>

                                </div>


                                <i
                                    class="fa-solid fa-chevron-right management-arrow">
                                </i>

                            </a>


                        </div>

                    </section>


                    <!-- SYSTEM STATUS -->

                    <section class="admin-card status-card">

                        <div class="admin-card-header">

                            <div class="admin-card-header-left">

                                <div class="admin-card-icon">

                                    <i class="fa-solid fa-server"></i>

                                </div>

                                <div>

                                    <h3>
                                        System Status
                                    </h3>

                                    <p>
                                        Current platform services.
                                    </p>

                                </div>

                            </div>

                        </div>


                        <div class="status-item">

                            <span class="status-dot"></span>

                            <div>

                                <strong>
                                    JOBSPHERE API
                                </strong>

                                <span>
                                    Backend service
                                </span>

                            </div>

                            <span class="status-online">
                                ACTIVE
                            </span>

                        </div>


                        <div class="status-item">

                            <span class="status-dot"></span>

                            <div>

                                <strong>
                                    Database
                                </strong>

                                <span>
                                    Application data
                                </span>

                            </div>

                            <span class="status-online">
                                ACTIVE
                            </span>

                        </div>


                        <div class="status-item">

                            <span class="status-dot"></span>

                            <div>

                                <strong>
                                    Authentication
                                </strong>

                                <span>
                                    User security
                                </span>

                            </div>

                            <span class="status-online">
                                ACTIVE
                            </span>

                        </div>


                        <div class="status-item">

                            <span class="status-dot"></span>

                            <div>

                                <strong>
                                    AI Career Service
                                </strong>

                                <span>
                                    Ollama integration
                                </span>

                            </div>

                            <span class="status-online">
                                ACTIVE
                            </span>

                        </div>


                        <div class="admin-info">

                            <div class="admin-info-title">

                                <i class="fa-solid fa-circle-info"></i>

                                Administrator Access

        /* =====================================================
           ADMIN SIGN OUT
           ===================================================== */

        function addAdminSignOut() {

            /*
             * IMPORTANT:
             * app.css uses .side
             */

            const sidebar =
                document.querySelector(".side");


            if (!sidebar) {

                console.error(
                    "JOBSPHERE sidebar (.side) was not found."
                );

                return;

            }


            /*
             * Remove an existing Sign Out button.
             */

            const existingLogout =
                sidebar.querySelector(
                    ".admin-sidebar-logout"
                );


            if (existingLogout) {

                existingLogout.remove();

            }


          

            /*
             * If admin.html is not found,
             * search by visible text.
             */

            if (!adminCenterLink) {

                const links =
                    sidebar.querySelectorAll("a");


                for (
                    let i = 0;
                    i < links.length;
                    i++
                ) {

                    const text =
                        links[i]
                            .textContent
                            .trim()
                            .toLowerCase();


                    if (
                        text.includes(
                            "admin center"
                        )
                    ) {

                        adminCenterLink =
                            links[i];

                        break;

                    }

                }

            }


            /*
             * Insert Sign Out directly after
             * Admin Center.
             */

            if (adminCenterLink) {

                let adminItem =
                    adminCenterLink.closest("li");


                if (!adminItem) {

                    adminItem =
                        adminCenterLink.closest(
                            ".nav-item"
                        );

                }


                if (!adminItem) {

                    adminItem =
                        adminCenterLink.parentElement;

                }


                if (
                    adminItem &&
                    adminItem.parentNode
                ) {

                    adminItem.parentNode.insertBefore(
                        logoutContainer,
                        adminItem.nextSibling
                    );

                }
                else {

                    sidebar.appendChild(
                        logoutContainer
                    );

                }

                console.log(
                    "JOBSPHERE: Sign Out inserted after Admin Center."
                );

            }
            else {

                /*
                 * Fallback.
                 */

                sidebar.appendChild(
                    logoutContainer
                );

                console.warn(
                    "JOBSPHERE: Admin Center link was not found."
                );

            }


            /*
             * Sign Out click.
             */

            const logoutButton =
                document.getElementById(
                    "adminSignOutButton"
                );


            if (logoutButton) {

                logoutButton.addEventListener(
                    "click",
                    adminLogout
                );

            }

        }


        /* =====================================================
           LOGOUT
           ===================================================== */

        function adminLogout() {

            const confirmed =
                window.confirm(
                    "Are you sure you want to sign out?"
                );


            if (!confirmed) {

                return;

            }


            /*
             * Remove authentication data.
             */

            const authKeys = [

                "token",
                "authToken",
                "jwt",
                "accessToken",
                "user",
                "currentUser",
                "current_user",
                "loggedInUser",
                "jobsphereUser"

            ];


            authKeys.forEach(
                function (key) {

                    localStorage.removeItem(
                        key
                    );

                }
            );


            /*
             * Clear session storage.
             */

            sessionStorage.clear();


            /*
             * Redirect to login.
             */

            window.location.replace(
                "login.html"
            );

        }

        /* =====================================================
           COURSE PARTICIPANTS
           ===================================================== */

        window.loadCourseParticipants =
            async function () {

                const box =
                    document.getElementById(
                        "courseParticipants"
                    );


                const filter =
                    document.getElementById(
                        "courseFilter"
                    );


                const filterButton =
                    document.getElementById(
                        "filterButton"
                    );


                const selectedCourse =
                    filter.value;


                box.innerHTML = `

                    <div class="admin-loading">

                        <i class="fa-solid fa-spinner fa-spin"></i>

                        Loading course participation...

                    </div>

                `;


                filterButton.disabled =
                    true;


                try {

                    let url =
                        "/admin/courses/participants";


                    if (selectedCourse) {

                        url +=
                            "?courseId=" +
                            encodeURIComponent(
                                selectedCourse
                            );

                    }


                    const data =
                        await apiJson(
                            url,
                            {
                                method: "GET",
                                headers: auth()
                            }
                        );


                    /*
                     * Load courses.
                     *
                     * IMPORTANT:
                     * Correct JavaScript syntax.
                     */

                    if (
                        Array.isArray(
                            data.courses
                        )
                    ) {

                        const currentValue =
                            filter.value;


                        filter.innerHTML = `

                            <option value="">
                                All courses
                            </option>

                        `;


                        data.courses.forEach(
                            function (course) {

                                const option =
                                    document.createElement(
                                        "option"
                                    );


                                option.value =
                                    course.id;


                                option.textContent =
                                    course.name;


                                filter.appendChild(
                                    option
                                );

                            }
                        );


                        filter.value =
                            currentValue;

                    }


                    /*
                     * No participants.
                     */

                    if (
                        !Array.isArray(
                            data.participants
                        ) ||
                        data.participants.length === 0
                    ) {

                        box.innerHTML = `

                            <div class="no-participants">

                                <i class="fa-solid fa-user-graduate"></i>

                                <strong>
                                    No course attempts found
                                </strong>

                                <div style="margin-top:5px">

                                    There are no course participation
                                    records for the selected filter.

                                </div>

                            </div>

                        `;

                        return;

                    }


                    let tableRows = "";


                    data.participants.forEach(
                        function (participant) {

                            const passed =
                                participant.passed === true;


                            const certificateSent =
                                participant.certificateSent === true;


                            const score =
                                participant.score ?? 0;


                            const correct =
                                participant.correctAnswers ?? 0;


                            const total =
                                participant.totalQuestions ?? 10;


                            let completed =
                                participant.completedAt || "";


                            if (completed) {

                                completed =
                                    String(completed)
                                        .replace(
                                            "T",
                                            " "
                                        )
                                        .slice(
                                            0,
                                            16
                                        );

                            }


                            let action = "";


                            /*
                             * Failed.
                             */

                            if (!passed) {

                                action = `

                                    <span class="course-status failed">

                                        <i class="fa-solid fa-rotate-right"></i>

                                        Retry Required

                                    </span>

                                `;

                            }


                            /*
                             * Certificate already sent.
                             */

                            else if (certificateSent) {

                                action = `

                                    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">

                                        <span class="certificate-sent">

                                            <i class="fa-solid fa-circle-check"></i>

                                            Sent

                                        </span>

                                        ${
                                            participant.certificateId
                                            ?
                                            `
                                            <button
                                                type="button"
                                                class="certificate-not-sent"
                                                style="background:#edf5ff;color:#1769e0"
                                                onclick="downloadAdminCertificate(${participant.certificateId})"
                                            >
                                                <i class="fa-solid fa-file-pdf" style="color:#1769e0"></i>
                                                PDF
                                            </button>
                                            `
                                            :
                                            ''
                                        }

                                    </div>

                                `;

                            }


                            /*
                             * Send certificate.
                             */

                            else {

                                action = `

                                    <button
                                        type="button"
                                        class="certificate-not-sent"
                                        onclick="sendCertificate(${participant.attemptId}, this)"
                                    >

                                        <i class="fa-solid fa-certificate"></i>

                                        Send Certificate

                                    </button>

                                `;

                            }


                            tableRows += `

                                <tr>

                                    <td>

                                        <span class="participant-name">

                                            ${esc(
                                                participant.fullName ||
                                                "Unknown User"
                                            )}

                                        </span>


                                        <span class="participant-email">

                                            ${esc(
                                                participant.email ||
                                                "No email"
                                            )}

                                        </span>

                                    </td>


                                    <td>

                                        ${esc(
                                            participant.courseName ||
                                            "Unknown Course"
                                        )}

                                    </td>


                                    <td>

                                        <span class="score-value">

                                            ${esc(score)}%

                                        </span>


                                        <span class="score-detail">

                                            ${esc(correct)}
                                            /
                                            ${esc(total)}
                                            correct

                                        </span>

                                    </td>


                                    <td>

                                        ${
                                            passed

                                            ?

                                            `

                                                <span class="course-status passed">

                                                    <i class="fa-solid fa-circle-check"></i>

                                                    Passed

                                                </span>

                                            `

                                            :

                                            `

                                                <span class="course-status failed">

                                                    <i class="fa-solid fa-circle-xmark"></i>

                                                    Failed

                                                </span>

                                            `
                                        }

                                    </td>


                                    <td>

                                        ${esc(
                                            completed ||
                                            "—"
                                        )}

                                    </td>


                                    <td>

                                        ${action}

                                    </td>

                                </tr>

                            `;

                        }
                    );


                    box.innerHTML = `

                        <div class="participants-wrapper">

                            <table class="participants-table">

                                <thead>

                                    <tr>

                                        <th>
                                            Participant
                                        </th>

                                        <th>
                                            Course
                                        </th>

                                        <th>
                                            Score
                                        </th>

                                        <th>
                                            Status
                                        </th>

                                        <th>
                                            Completed
                                        </th>

                                        <th>
                                            Certificate
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                                    ${tableRows}

                                </tbody>

                            </table>

                        </div>

                    `;

                }


                catch (error) {

                    console.error(
                        "Course participants error:",
                        error
                    );


                    box.innerHTML = `

                        <div class="admin-error">

                            <i class="fa-solid fa-triangle-exclamation"></i>

                            Unable to load course participation.

                            <div style="margin-top:7px">

                                ${esc(
                                    error.message ||
                                    "Please check the server connection."
                                )}

                            </div>

                        </div>

                    `;

                }


                finally {

                    filterButton.disabled =
                        false;

                }

            };


        /* =====================================================
           SEND CERTIFICATE
           ===================================================== */

        window.sendCertificate =
            async function (
                attemptId,
                button
            ) {

                if (!attemptId) {

                    alert(
                        "Invalid course attempt."
                    );

                    return;

                }


                const confirmed =
                    window.confirm(
                        "Send the certificate to this participant by email?"
                    );


                if (!confirmed) {

                    return;

                }


                const originalText =
                    button.innerHTML;


                button.disabled =
                    true;


                button.innerHTML = `

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Sending...

                `;


                try {

                    const result = await apiJson(

                        "/admin/courses/certificates/"
                        +
                        encodeURIComponent(
                            attemptId
                        )
                        +
                        "/send",

                        {
                            method: "POST",
                            headers: auth()
                        }

                    );


                    button.outerHTML = `

                        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">

                            <span class="certificate-sent">

                                <i class="fa-solid fa-circle-check"></i>

                                Sent

                            </span>

                            ${
                                result.certificateId
                                ?
                                `
                                <button
                                    type="button"
                                    class="certificate-not-sent"
                                    style="background:#edf5ff;color:#1769e0"
                                    onclick="downloadAdminCertificate(${result.certificateId})"
                                >
                                    <i class="fa-solid fa-file-pdf" style="color:#1769e0"></i>
                                    PDF
                                </button>
                                `
                                :
                                ''
                            }

                        </div>

                    `;

                }


                catch (error) {

                    console.error(
                        "Certificate sending error:",
                        error
                    );


                    alert(
                        error.message ||
                        "Unable to send certificate."
                    );


                    button.disabled =
                        false;


                    button.innerHTML =
                        originalText;

                }

            };


        window.downloadAdminCertificate =
            async function (certificateId) {

                try {

                    const response =
                        await fetch(
                            API +
                            "/admin/courses/certificates/" +
                            encodeURIComponent(certificateId),
                            {
                                headers: auth()
                            }
                        );

                    if (!response.ok) {
                        throw new Error(
                            "Certificate could not be downloaded."
                        );
                    }

                    const blob =
                        await response.blob();

                    const url =
                        URL.createObjectURL(blob);

                    const link =
                        document.createElement("a");

                    link.href = url;
                    link.download =
                        "JOBSPHERE-Certificate.pdf";

                    document.body.appendChild(link);
                    link.click();
                    link.remove();

                    setTimeout(
                        () => URL.revokeObjectURL(url),
                        1000
                    );

                }
                catch (error) {

                    alert(
                        error.message ||
                        "Unable to download certificate."
                    );

                }

            };


        /* =====================================================
           COURSE FILTER
           ===================================================== */

        const courseFilter =
            document.getElementById(
                "courseFilter"
            );


        if (courseFilter) {

            courseFilter.addEventListener(
                "change",
                function () {

                    /*
                     * Apply Filter button is used
                     * manually.
                     */

                }
            );

        }


        /* =====================================================
           START PAGE
           ===================================================== */

        loadStatistics();

        loadCourseParticipants();


        /* =====================================================
           ADD SIGN OUT
           
           Small delay allows shell() to finish
           rendering the sidebar.
           ===================================================== */

        setTimeout(
            function () {

                addAdminSignOut();

            },
            100
        );


    }

);

</script>
