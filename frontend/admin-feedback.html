<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Feedback & Ratings | JOBSPHERE</title>

<link rel="stylesheet"
      href="assets/css/app.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

    /* =========================================================
       ADMIN FEEDBACK PAGE
       ========================================================= */

    .feedback-page {
        max-width: 1200px;
        margin: 0 auto;
    }


    /* =========================================================
       HERO
       ========================================================= */

    .feedback-hero {
        position: relative;
        overflow: hidden;

        padding: 32px;

        border-radius: 22px;

        background:
            linear-gradient(
                135deg,
                #071d39 0%,
                #1769e0 68%,
                #4d91ee 100%
            );

        color: white;

        box-shadow:
            0 20px 55px rgba(23,105,224,.20);
    }


    .feedback-hero::before {

        content: "";

        position: absolute;

        width: 280px;
        height: 280px;

        border-radius: 50%;

        border: 1px solid rgba(255,255,255,.12);

        right: -90px;
        top: -140px;
    }


    .feedback-hero::after {

        content: "";

        position: absolute;

        width: 190px;
        height: 190px;

        border-radius: 50%;

        background:
            rgba(255,255,255,.06);

        right: 160px;
        bottom: -135px;
    }


    .feedback-hero-content {

        position: relative;

        z-index: 2;

        max-width: 720px;
    }


    .feedback-badge {

        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding: 7px 12px;

        border-radius: 999px;

        background:
            rgba(255,255,255,.12);

        border:
            1px solid rgba(255,255,255,.18);

        font-size: 10px;

        font-weight: 800;

        letter-spacing: .8px;

        margin-bottom: 14px;
    }


    .feedback-hero h2 {

        margin: 0;

        font-size: 30px;

        letter-spacing: -.6px;
    }


    .feedback-hero p {

        margin: 10px 0 0;

        color: #dceaff;

        font-size: 13px;

        line-height: 1.7;
    }


    /* =========================================================
       SUMMARY
       ========================================================= */

    .feedback-summary {

        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 16px;

        margin-top: 18px;
    }


    .summary-card {

        background: white;

        border:
            1px solid var(--line);

        border-radius: 18px;

        padding: 20px;

        box-shadow: var(--shadow);

        display: flex;

        align-items: center;

        gap: 14px;
    }


    .summary-icon {

        width: 45px;
        height: 45px;

        min-width: 45px;

        border-radius: 13px;

        background: #edf4ff;

        color: var(--blue);

        display: grid;

        place-items: center;

        font-size: 17px;
    }


    .summary-label {

        color: var(--muted);

        font-size: 10px;

        font-weight: 800;

        text-transform: uppercase;

        letter-spacing: .6px;
    }


    .summary-value {

        margin-top: 3px;

        font-size: 24px;

        font-weight: 900;

        color: var(--navy);
    }


    /* =========================================================
       CONTENT CARD
       ========================================================= */

    .feedback-container {

        margin-top: 20px;

        background: white;

        border:
            1px solid var(--line);

        border-radius: 20px;

        padding: 25px;

        box-shadow: var(--shadow);
    }


    .feedback-header {

        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 20px;

        margin-bottom: 20px;
    }


    .feedback-header h2 {

        margin: 0;

        font-size: 20px;
    }


    .feedback-header p {

        margin: 4px 0 0;

        font-size: 11px;

        color: var(--muted);
    }


    .feedback-count {

        padding: 7px 11px;

        border-radius: 999px;

        background: #edf4ff;

        color: var(--blue);

        font-size: 10px;

        font-weight: 800;
    }


    /* =========================================================
       NOTICE
       ========================================================= */

    #n {

        margin-bottom: 15px;
    }


    /* =========================================================
       FEEDBACK LIST
       ========================================================= */

    .feedback-list {

        display: grid;

        gap: 14px;
    }


    /* =========================================================
       FEEDBACK ITEM
       ========================================================= */

    .feedback-item {

        border:
            1px solid #e4ebf4;

        border-radius: 16px;

        padding: 19px;

        transition:
            transform .2s,
            box-shadow .2s,
            border-color .2s;

        background:
            linear-gradient(
                180deg,
                #ffffff,
                #fbfdff
            );
    }


    .feedback-item:hover {

        transform:
            translateY(-2px);

        border-color:
            #cdddf2;

        box-shadow:
            0 12px 28px rgba(15,45,80,.08);
    }


    /* =========================================================
       TOP
       ========================================================= */

    .feedback-top {

        display: flex;

        align-items: flex-start;

        justify-content: space-between;

        gap: 20px;
    }


    .feedback-user {

        display: flex;

        align-items: center;

        gap: 12px;
    }


    .feedback-avatar {

        width: 42px;
        height: 42px;

        min-width: 42px;

        border-radius: 12px;

        background:
            linear-gradient(
                135deg,
                #1769e0,
                #4d91ee
            );

        color: white;

        display: grid;

        place-items: center;

        font-weight: 900;

        font-size: 15px;
    }


    .feedback-user-name {

        font-weight: 800;

        color: var(--navy);

        font-size: 13px;
    }


    .feedback-user-id {

        margin-top: 3px;

        color: var(--muted);

        font-size: 10px;
    }


    .feedback-date {

        color: var(--muted);

        font-size: 10px;

        white-space: nowrap;
    }


    /* =========================================================
       RATING
       ========================================================= */

    .feedback-rating {

        display: flex;

        align-items: center;

        gap: 3px;

        margin-top: 15px;
    }


    .feedback-rating i {

        font-size: 15px;

        color: #f5b51b;
    }


    .rating-number {

        margin-left: 7px;

        padding: 4px 8px;

        border-radius: 7px;

        background: #fff7df;

        color: #9a6b00;

        font-size: 10px;

        font-weight: 900;
    }


    /* =========================================================
       COMMENT
       ========================================================= */

    .feedback-comment {

        margin-top: 14px;

        padding: 15px;

        border-radius: 12px;

        background: #f7faff;

        border:
            1px solid #e2eaf5;

        color: #40556e;

        font-size: 12px;

        line-height: 1.7;

        white-space: pre-wrap;
    }


    .feedback-comment.empty-comment {

        color: #8292a5;

        font-style: italic;
    }


    /* =========================================================
       BOTTOM
       ========================================================= */

    .feedback-bottom {

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 15px;

        margin-top: 15px;

        padding-top: 14px;

        border-top:
            1px solid #edf2f7;
    }


    .feedback-source {

        display: flex;

        align-items: center;

        gap: 7px;

        color: var(--muted);

        font-size: 10px;
    }


    .feedback-source i {

        color: var(--blue);
    }


    .delete-feedback {

        display: inline-flex;

        align-items: center;

        gap: 7px;

        border: 0;

        cursor: pointer;

        padding: 8px 12px;

        border-radius: 9px;

        background: #fff0f1;

        color: #b82e3a;

        font-family: inherit;

        font-size: 10px;

        font-weight: 800;

        transition: .2s;
    }


    .delete-feedback:hover {

        background: #ffe1e4;

        transform:
            translateY(-1px);
    }


    /* =========================================================
       EMPTY
       ========================================================= */

    .feedback-empty {

        text-align: center;

        padding: 60px 20px;
    }


    .feedback-empty-icon {

        width: 65px;
        height: 65px;

        margin: 0 auto 15px;

        border-radius: 18px;

        background: #edf4ff;

        color: var(--blue);

        display: grid;

        place-items: center;

        font-size: 25px;
    }


    .feedback-empty h3 {

        margin: 0;

        font-size: 17px;
    }


    .feedback-empty p {

        margin: 7px auto 0;

        max-width: 400px;

        color: var(--muted);

        font-size: 11px;

        line-height: 1.6;
    }


    /* =========================================================
       LOADING
       ========================================================= */

    .feedback-loading {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 10px;

        padding: 45px;

        color: var(--muted);

        font-size: 12px;
    }


    .feedback-loading i {

        color: var(--blue);

        font-size: 16px;
    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media(max-width:850px) {

        .feedback-summary {

            grid-template-columns:
                1fr;
        }

    }


    @media(max-width:600px) {

        .feedback-hero {

            padding: 25px;
        }

        }

        }


        .feedback-bottom {

            align-items: flex-start;

            flex-direction: column;
        }

    }

</style>

</head>

<body>

<div class="app"
     id="app">
</div>

<script src="assets/js/app.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================
           AUTHENTICATION
           ===================================================== */

        const currentUser =
            requireUser();


        if (
            currentUser.role !== "ADMIN"
        ) {

            location.href =
                "dashboard.html";

            return;

        }


        /* =====================================================
           PAGE
           ===================================================== */

        app.innerHTML =

            shell(
                "Feedback & Ratings",
                "admin"
            )

            +

            `

            <div class="feedback-page">


                <!-- =============================================
                     HERO
                     ============================================= -->

                <section class="feedback-hero">

                    <div class="feedback-hero-content">

                        <div class="feedback-badge">

                            <i class="fa-solid fa-star"></i>

                            USER EXPERIENCE

                        </div>


                        <h2>
                            Feedback & Ratings
                        </h2>


                        <p>

                            Review what JOBSPHERE users
                            think about their experience.
                            Use their feedback to identify
                            strengths and improve the platform.

                        </p>

                    </div>

                </section>



                <!-- =============================================
                     SUMMARY
                     ============================================= -->

                <div class="feedback-summary">


                    <div class="summary-card">

                        <div class="summary-icon">

                            <i class="fa-solid fa-comments"></i>

                        </div>

                        <div>

                            <div class="summary-label">
                                Total Feedback
                            </div>

                            <div
                                class="summary-value"
                                id="totalFeedback"
                            >
                                0
                            </div>

                        </div>

                    </div>



                    <div class="summary-card">

                        <div class="summary-icon">

                            <i class="fa-solid fa-star"></i>

                        </div>

                        <div>

                            <div class="summary-label">
                                Average Rating
                            </div>

                            <div
                                class="summary-value"
                                id="averageRating"
                            >
                                0.0
                            </div>

                        </div>

                    </div>



                    <div class="summary-card">

                        <div class="summary-icon">

                            <i class="fa-solid fa-thumbs-up"></i>

                        </div>

                        <div>

                            <div class="summary-label">
                                Positive Ratings
                            </div>

                            <div
                                class="summary-value"
                                id="positiveRatings"
                            >
                                0%
                            </div>

                        </div>

                    </div>


                </div>



                <!-- =============================================
                     FEEDBACK CONTENT
                     ============================================= -->

                <section class="feedback-container">


                    <div class="feedback-header">

                        <div>

                            <h2>
                                User Reviews
                            </h2>

                            <p>
                                Recent feedback submitted by
                                registered JOBSPHERE users.
                            </p>

                        </div>


                        <span
                            class="feedback-count"
                            id="feedbackCount"
                        >
                            0 Reviews
                        </span>

                    </div>


                    <div
                        id="n"
                        class="notice"
                    >
                    </div>


                    <div
                        id="rows"
                        class="feedback-list"
                    >

                        <div class="feedback-loading">

                            <i class="fa-solid fa-spinner fa-spin"></i>

                            Loading user feedback...

                        </div>

                    </div>


                </section>


            </div>

            `

            +

            closeShell();



        /* =====================================================
           ELEMENTS
           ===================================================== */

        const rows =
            document.getElementById(
                "rows"
            );

        const noticeBox =
            document.getElementById(
                "n"
            );

        const totalFeedback =
            document.getElementById(
                "totalFeedback"
            );

        const averageRating =
            document.getElementById(
                "averageRating"
            );

        const positiveRatings =
            document.getElementById(
                "positiveRatings"
            );

        const feedbackCount =
            document.getElementById(
                "feedbackCount"
            );



        /* =====================================================
           CREATE STARS
           ===================================================== */

        function stars(rating) {

            let html = "";

            for (
                let i = 1;
                i <= 5;
                i++
            ) {

                html +=

                    i <= rating

                        ? '<i class="fa-solid fa-star"></i>'

                        : '<i class="fa-regular fa-star"></i>';

            }

            return html;

        }



        /* =====================================================
           LOAD FEEDBACK
           ===================================================== */

        async function loadFeedback() {

            rows.innerHTML =

                `

                <div class="feedback-loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Loading user feedback...

                </div>

                `;


            try {

                const response =

                    await apiJson(
                        "/admin/feedback",
                        {
                            method: "GET",
                            headers: auth()
                        }
                    );


                const feedback =

                    Array.isArray(response)
                        ? response
                        : [];


                /* =============================================
                   SUMMARY
                   ============================================= */

                const total =
                    feedback.length;


                let ratingTotal = 0;

                let positive = 0;


                feedback.forEach(
                    function (item) {

                        const rating =
                            Number(
                                item.rating || 0
                            );

                        ratingTotal +=
                            rating;


                        if (
                            rating >= 4
                        ) {

                            positive++;

                        }

                    }
                );


                const average =

                    total > 0

                        ? (
                            ratingTotal /
                            total
                          ).toFixed(1)

                        : "0.0";


                const positivePercentage =

                    total > 0

                        ? Math.round(
                            (
                                positive /
                                total
                            ) * 100
                          )

                        : 0;


                totalFeedback.textContent =
                    total;

                averageRating.textContent =
                    average;

                positiveRatings.textContent =
                    positivePercentage + "%";

                feedbackCount.textContent =

                    total +
                    (
                        total === 1
                            ? " Review"
                            : " Reviews"
                    );



                /* =============================================
                   EMPTY
                   ============================================= */

                if (
                    total === 0
                ) {

                    rows.innerHTML =

                        `

                        <div class="feedback-empty">

                            <div class="feedback-empty-icon">

                                <i class="fa-regular fa-comment-dots"></i>

                            </div>


                            <h3>
                                No feedback yet
                            </h3>


                            <p>

                                User feedback will appear here
                                after registered users submit
                                their ratings and comments.

                            </p>

                        </div>

                        `;

                    return;

                }



                /* =============================================
                   SORT NEWEST FIRST
                   ============================================= */

                feedback.sort(
                    function (a, b) {

                        return new Date(
                            b.createdAt
                        ) -

                        new Date(
                            a.createdAt
                        );

                    }
                );



                /* =============================================
                   RENDER
                   ============================================= */

                rows.innerHTML =

                    feedback.map(
                        function (x) {


                            const rating =
                                Number(
                                    x.rating || 0
                                );


                            const userId =
                                x.userId ??
                                "Deleted account";


                            const displayName =

                                "JOBSPHERE User";


                            const initial =

                                String(
                                    displayName
                                )
                                .charAt(0)
                                .toUpperCase();


                            const hasComment =

                                x.comment &&
                                String(
                                    x.comment
                                ).trim();


                            const date =

                                x.createdAt

                                    ? new Date(
                                        x.createdAt
                                      ).toLocaleString(
                                        [],
                                        {
                                            year: "numeric",
                                            month: "short",
                                            day: "numeric",
                                            hour: "2-digit",
                                            minute: "2-digit"
                                        }
                                      )

                                    : "Date unavailable";


                            return `

                                <article
                                    class="feedback-item"
                                >


                                    <!-- TOP -->

                                    <div
                                        class="feedback-top"
                                    >


                                        <div
                                            class="feedback-user"
                                        >

                                            <div
                                                class="feedback-avatar"
                                            >

                                                ${initial}

                                            </div>


                                            <div>

                                                <div
                                                    class="feedback-user-name"
                                                >

                                                    ${displayName}

                                                </div>


                                                <div
                                                    class="feedback-user-id"
                                                >

                                                    User ID:
                                                    ${esc(
                                                        userId
                                                    )}

                                                </div>

                                            </div>

                                        </div>


                                        <div
                                            class="feedback-date"
                                        >

                                            <i
                                                class="fa-regular fa-clock"
                                            ></i>

                                            ${esc(
                                                date
                                            )}

                                        </div>


                                    </div>



                                    <!-- RATING -->

                                    <div
                                        class="feedback-rating"
                                    >

                                        ${stars(
                                            rating
                                        )}


                                        <span
                                            class="rating-number"
                                        >

                                            ${rating}/5

                                        </span>

                                    </div>



                                    <!-- COMMENT -->

                                    <div
                                        class="
                                            feedback-comment
                                            ${
                                                hasComment
                                                    ? ""
                                                    : "empty-comment"
                                            }
                                        "
                                    >

                                        ${
                                            hasComment

                                                ? esc(
                                                    x.comment
                                                  )

                                                : "No comment was provided with this rating."
                                        }

                                    </div>



                                    <!-- BOTTOM -->

                                    <div
                                        class="feedback-bottom"
                                    >


                                        <div
                                            class="feedback-source"
                                        >

                                            <i
                                                class="fa-solid fa-shield-halved"
                                            ></i>

                                            Submitted through
                                            JOBSPHERE

                                        </div>


                                        <button
                                            type="button"
                                            class="delete-feedback"
                                            onclick="deleteFeedback(${x.id})"
                                        >

                                            <i
                                                class="fa-solid fa-trash"
                                            ></i>

                                            Delete Feedback

                                        </button>


                                    </div>


                                </article>

                            `;

                        }
                    ).join("");


            }

            catch (error) {

                console.error(
                    "Feedback loading error:",
                    error
                );


                rows.innerHTML = "";


                notice(
                    noticeBox,
                    error.message ||
                    "Unable to load feedback."
                );

            }

        }



        /* =====================================================
           DELETE FEEDBACK
           ===================================================== */

        window.deleteFeedback =

            async function (id) {


                const confirmed =

                    confirm(
                        "Are you sure you want to delete this feedback?\n\nThis action cannot be undone."
                    );


                if (
                    !confirmed
                ) {

                    return;

                }


                try {


                    await apiJson(

                        "/admin/feedback/" +
                        id,

                        {

                            method: "DELETE",

                            headers: auth()

                        }

                    );


                    notice(

                        noticeBox,

                        "Feedback deleted successfully.",

                        true

                    );


                    await loadFeedback();


                }

                catch (error) {


                    console.error(
                        "Delete feedback error:",
                        error
                    );


                    notice(

                        noticeBox,

                        error.message ||
                        "Unable to delete feedback."

                    );

                }

            };



        /* =====================================================
           INITIAL LOAD
           ===================================================== */

        loadFeedback();

    }

);

</script>

</body>

</html>
