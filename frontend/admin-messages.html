<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Contact Messages | JOBSPHERE</title>

<link rel="stylesheet"
      href="assets/css/app.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

    /* =========================================================
       PAGE
       ========================================================= */

    .messages-page {
        max-width: 1180px;
        margin: 0 auto;
        padding-bottom: 50px;
    }


    /* =========================================================
       HERO
       ========================================================= */

    .messages-hero {
        position: relative;
        overflow: hidden;

        padding: 30px;

        border-radius: 22px;

        background:
            linear-gradient(
                135deg,
                #071d39 0%,
                #1769e0 65%,
                #4d91ee 100%
            );

        color: white;

        box-shadow:
            0 18px 50px rgba(23,105,224,.18);

        margin-bottom: 22px;
    }


    .messages-hero::before {
        content: "";

        position: absolute;

        width: 280px;
        height: 280px;

        border-radius: 50%;

        border: 1px solid rgba(255,255,255,.13);

        right: -80px;
        top: -130px;
    }


    .messages-hero::after {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        border-radius: 50%;

        background: rgba(255,255,255,.06);

        right: 120px;
        bottom: -120px;
    }


    .messages-hero-content {
        position: relative;
        z-index: 2;
    }


    .messages-badge {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding: 7px 12px;

        border-radius: 999px;

        background: rgba(255,255,255,.12);

        border:
            1px solid rgba(255,255,255,.18);

        font-size: 10px;

        font-weight: 800;

        letter-spacing: .8px;

        margin-bottom: 12px;
    }


    .messages-hero h2 {
        margin: 0;

        font-size: 28px;

        letter-spacing: -.5px;
    }


    .messages-hero p {
        margin: 8px 0 0;

        color: #dceaff;

        font-size: 13px;

        line-height: 1.7;

        max-width: 700px;
    }


    /* =========================================================
       STATISTICS
       ========================================================= */

    .message-stats {
        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 15px;

        margin-bottom: 22px;
    }


    .message-stat {
        background: white;

        border:
            1px solid var(--line);

        border-radius: 17px;

        padding: 18px;

        display: flex;

        align-items: center;

        gap: 14px;

        box-shadow: var(--shadow);
    }


    .message-stat-icon {
        width: 43px;
        height: 43px;

        min-width: 43px;

        border-radius: 13px;

        display: grid;

        place-items: center;

        background: #edf4ff;

        color: var(--blue);

        font-size: 16px;
    }


    .message-stat-number {
        font-size: 23px;

        font-weight: 900;

        color: var(--navy);

        line-height: 1;
    }


    .message-stat-label {
        margin-top: 5px;

        color: var(--muted);

        font-size: 10px;

        font-weight: 700;
    }


    /* =========================================================
       TOOLBAR
       ========================================================= */

    .messages-toolbar {
        background: white;

        border:
            1px solid var(--line);

        border-radius: 17px;

        padding: 15px;

        box-shadow: var(--shadow);

        margin-bottom: 20px;

        display: flex;

        align-items: center;

        gap: 12px;

        justify-content: space-between;
    }


    .message-search {
        position: relative;

        flex: 1;

        max-width: 500px;
    }


    .message-search i {
        position: absolute;

        left: 13px;

        top: 50%;

        transform:
            translateY(-50%);

        color: #8ca0b7;

        font-size: 13px;
    }


    .message-search input {
        width: 100%;

        box-sizing: border-box;

        border:
            1px solid #dce6f2;

        background: #f9fbfe;

        border-radius: 11px;

        padding: 11px 13px 11px 36px;

        outline: none;

        font-family: inherit;

        font-size: 12px;

        color: var(--navy);
    }


    .message-search input:focus {
        border-color: var(--blue);

        background: white;

        box-shadow:
            0 0 0 3px rgba(23,105,224,.08);
    }


    .message-filter {
        display: flex;

        gap: 6px;
    }


    .filter-btn {
        border: 1px solid #dce6f2;

        background: #f8fbff;

        color: #60748d;

        border-radius: 9px;

        padding: 9px 12px;

        font-family: inherit;

        font-size: 10px;

        font-weight: 800;

        cursor: pointer;

        transition: .2s;
    }


    .filter-btn:hover {
        border-color: var(--blue);

        color: var(--blue);
    }


    .filter-btn.active {
        background: #1769e0;

        border-color: #1769e0;

        color: white;
    }


    /* =========================================================
       NOTICE
       ========================================================= */

    #n {
        margin-bottom: 15px;
    }


    /* =========================================================
       MESSAGE CARD
       ========================================================= */

    .message-card {
        position: relative;

        background: white;

        border:
            1px solid var(--line);

        border-radius: 20px;

        padding: 22px;

        margin-bottom: 18px;

        box-shadow: var(--shadow);

        transition:
            transform .2s,
            box-shadow .2s,
            border-color .2s;
    }


    .message-card:hover {
        transform: translateY(-2px);

        box-shadow:
            0 16px 38px rgba(22,51,84,.10);

        border-color: #cfddec;
    }


    .message-card.unread {
        border-left:
            4px solid #1769e0;
    }


    .message-card.replied {
        border-left:
            4px solid #20a464;
    }


    /* =========================================================
       MESSAGE HEADER
       ========================================================= */

    .message-header {
        display: flex;

        justify-content: space-between;

        align-items: flex-start;

        gap: 20px;

        margin-bottom: 15px;
    }


    .message-user {
        display: flex;

        align-items: center;

        gap: 12px;
    }


    .message-avatar {
        width: 43px;
        height: 43px;

        min-width: 43px;

        border-radius: 13px;

        display: grid;

        place-items: center;

        background:
            linear-gradient(
                135deg,
                #1769e0,
                #4d91ee
            );

        color: white;

        font-size: 15px;

        font-weight: 900;
    }


    .message-user-name {
        margin: 0;

        font-size: 14px;

        font-weight: 900;

        color: var(--navy);
    }


    .message-user-email {
        display: block;

        margin-top: 3px;

        color: var(--blue);

        font-size: 11px;

        font-weight: 700;
    }


    .message-date {
        color: var(--muted);

        font-size: 10px;

        white-space: nowrap;

        padding-top: 4px;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .message-status {
        display: flex;

        align-items: center;

        gap: 6px;

        margin-bottom: 8px;
    }


    .status-badge {
        display: inline-flex;

        align-items: center;

        gap: 5px;

        padding: 5px 9px;

        border-radius: 999px;

        font-size: 9px;

        font-weight: 900;

        letter-spacing: .4px;
    }


    .status-unread {
        background: #edf4ff;

        color: #1769e0;
    }


    .status-read {
        background: #f1f4f8;

        color: #64778d;
    }


    .status-replied {
        background: #eaf9f1;

        color: #16804d;
    }


    /* =========================================================
       SUBJECT
       ========================================================= */

    .message-subject {
        margin: 5px 0 0;

        font-size: 17px;

        color: var(--navy);

        letter-spacing: -.2px;
    }


    /* =========================================================
       MESSAGE BODY
       ========================================================= */

    .message-body-label {
        margin-top: 18px;

        margin-bottom: 7px;

        font-size: 10px;

        text-transform: uppercase;

        letter-spacing: .6px;

        color: #8ca0b7;

        font-weight: 900;
    }


    .message-body {
        background: #f7faff;

        border:
            1px solid #e1eaf5;

        border-radius: 13px;

        padding: 15px;

        line-height: 1.75;

        white-space: pre-wrap;

        font-size: 12px;

        color: #43566c;
    }


    /* =========================================================
       REPLY SECTION
       ========================================================= */

    .reply-section {
        margin-top: 20px;

        padding-top: 20px;

        border-top:
            1px solid #e8eef5;
    }


    .reply-header {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 9px;
    }


    .reply-title {
        display: flex;

        align-items: center;

        gap: 7px;

        font-size: 12px;

        font-weight: 900;

        color: var(--navy);
    }


    .reply-title i {
        color: var(--blue);
    }


    .reply-recipient {
        font-size: 10px;

        color: var(--muted);
    }


    .reply-box {
        position: relative;
    }


    .reply-box textarea {
        width: 100%;

        min-height: 115px;

        box-sizing: border-box;

        border:
            1px solid #dce6f2;

        border-radius: 12px;

        padding: 13px;

        font-family: inherit;

        font-size: 12px;

        color: var(--navy);

        background: #fbfdff;

        resize: vertical;

        outline: none;

        transition: .2s;
    }


    .reply-box textarea:focus {
        border-color: var(--blue);

        background: white;

        box-shadow:
            0 0 0 3px rgba(23,105,224,.08);
    }


    .reply-bottom {
        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 10px;

        margin-top: 9px;
    }


    .reply-hint {
        font-size: 10px;

        color: var(--muted);
    }


    .reply-actions {
        display: flex;

        gap: 8px;
    }


    .reply-btn {
        min-width: 125px;
    }


    /* =========================================================
       PREVIOUS REPLY
       ========================================================= */

    .previous-reply {
        margin-top: 18px;

        padding: 16px;

        border-radius: 13px;

        background: #eef9f3;

        border:
            1px solid #d4efdf;
    }


    .previous-reply-header {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 10px;

        margin-bottom: 8px;
    }


    .previous-reply-title {
        display: flex;

        align-items: center;

        gap: 7px;

        font-size: 11px;

        font-weight: 900;

        color: #176c45;
    }


    .previous-reply-title i {
        font-size: 12px;
    }


    .previous-reply-date {
        font-size: 9px;

        color: #6c8d7b;
    }


    .previous-reply p {
        margin: 0;

        white-space: pre-wrap;

        line-height: 1.7;

        font-size: 12px;

        color: #466457;
    }


    /* =========================================================
       CARD FOOTER
       ========================================================= */

    .message-footer {
        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 15px;

        margin-top: 18px;

        padding-top: 15px;

        border-top:
            1px solid #edf2f7;
    }


    .message-footer-info {
        display: flex;

        align-items: center;

        gap: 6px;

        color: var(--muted);

        font-size: 9px;
    }


    .delete-btn {
        border: 1px solid #f0d6d6;

        background: #fff7f7;

        color: #c84444;

        border-radius: 9px;

        padding: 8px 12px;

        font-family: inherit;

        font-size: 10px;

        font-weight: 800;

        cursor: pointer;

        transition: .2s;
    }


    .delete-btn:hover {
        background: #ffecec;

        border-color: #e8baba;
    }


    /* =========================================================
       EMPTY
       ========================================================= */

    .messages-empty {
        text-align: center;

        background: white;

        border:
            1px solid var(--line);

        border-radius: 20px;

        padding: 55px 20px;

        box-shadow: var(--shadow);
    }


    .messages-empty-icon {
        width: 58px;
        height: 58px;

        border-radius: 18px;

        margin: 0 auto 14px;

        background: #edf4ff;

        color: var(--blue);

        display: grid;

        place-items: center;

        font-size: 22px;
    }


    .messages-empty h3 {
        margin: 0;

        font-size: 16px;

        color: var(--navy);
    }


    .messages-empty p {
        margin: 7px 0 0;

        color: var(--muted);

        font-size: 11px;
    }


    /* =========================================================
       LOADING
       ========================================================= */

    .messages-loading {
        text-align: center;

        padding: 45px;

        color: var(--muted);

        font-size: 12px;
    }


    .messages-loading i {
        color: var(--blue);

        font-size: 22px;

        margin-bottom: 10px;
    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media(max-width:850px) {

        .message-stats {
            grid-template-columns: 1fr;
        }

        .messages-toolbar {

        }

        .message-search {

        }

        .message-filter {

    }


    @media(max-width:650px) {

        }

        .message-footer {
            align-items: flex-start;

            flex-direction: column;
        }

    }

</style>

<body>

<div class="app"
     id="app">
</div>

<script src="assets/js/app.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =========================================================
       AUTHENTICATION
       ========================================================= */

    const currentUser = requireUser();


    if (currentUser.role !== "ADMIN") {

        location.href = "dashboard.html";

        return;

    }


    /* =========================================================
       PAGE
       ========================================================= */

    app.innerHTML =

        shell("Contact Messages", "admin") +

        `

        <div class="messages-page">


            <!-- =================================================
                 HERO
                 ================================================= -->

            <section class="messages-hero">

                <div class="messages-hero-content">

                    <div class="messages-badge">

                        <i class="fa-solid fa-inbox"></i>

                        ADMIN SUPPORT CENTER

                    </div>


                    <h2>
                        Contact Messages
                    </h2>


                    <p>

                        Manage questions, support requests and
                        suggestions from JOBSPHERE users.
                        Reply directly to their registered email
                        address from one place.

                    </p>

                </div>

            </section>


            <!-- =================================================
                 STATISTICS
                 ================================================= -->

            <section class="message-stats">


                <div class="message-stat">

                    <div class="message-stat-icon">

                        <i class="fa-solid fa-envelope"></i>

                    </div>

                    <div>

                        <div
                            class="message-stat-number"
                            id="totalMessages"
                        >
                            0
                        </div>

                        <div class="message-stat-label">
                            Total Messages
                        </div>

                    </div>

                </div>


                <div class="message-stat">

                    <div class="message-stat-icon">

                        <i class="fa-solid fa-envelope-open"></i>

                    </div>

                    <div>

                        <div
                            class="message-stat-number"
                            id="unreadMessages"
                        >
                            0
                        </div>

                        <div class="message-stat-label">
                            Unread Messages
                        </div>

                    </div>

                </div>


                <div class="message-stat">

                    <div class="message-stat-icon">

                        <i class="fa-solid fa-reply"></i>

                    </div>

                    <div>

                        <div
                            class="message-stat-number"
                            id="repliedMessages"
                        >
                            0
                        </div>

                        <div class="message-stat-label">
                            Replied Messages
                        </div>

                    </div>

                </div>


            </section>


            <!-- =================================================
                 TOOLBAR
                 ================================================= -->

            <section class="messages-toolbar">


                <div class="message-search">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by name, email or subject..."
                    >

                </div>


                <div class="message-filter">

                    <button
                        type="button"
                        class="filter-btn active"
                        data-filter="ALL"
                    >
                        All
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-filter="UNREAD"
                    >
                        Unread
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-filter="REPLIED"
                    >
                        Replied
                    </button>

                </div>


            </section>


            <div
                id="n"
                class="notice">
            </div>


            <!-- =================================================
                 MESSAGES
                 ================================================= -->

            <div id="rows">

                <div class="messages-loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    <br>

                    Loading contact messages...

                </div>

            </div>


        </div>

        ` +

        closeShell();


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const rows =
        document.getElementById("rows");

    const noticeBox =
        document.getElementById("n");

    const searchInput =
        document.getElementById("searchInput");

    const totalMessages =
        document.getElementById("totalMessages");

    const unreadMessages =
        document.getElementById("unreadMessages");

    const repliedMessages =
        document.getElementById("repliedMessages");


    let allMessages = [];

    let activeFilter = "ALL";


    /* =========================================================
       LOAD MESSAGES
       ========================================================= */

    async function loadMessages() {

        rows.innerHTML =

            `

            <div class="messages-loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <br>

                Loading contact messages...

            </div>

            `;


        try {

            const response =

                await apiJson(

                    "/admin/contact",

                    {

                        method: "GET",

                        headers: auth()

                    }

                );


            allMessages =

                Array.isArray(response)
                    ? response
                    : [];


            updateStatistics();

            renderMessages();

        }

        catch (error) {

            console.error(
                "Load contact messages error:",
                error
            );


            rows.innerHTML = "";


            notice(

                noticeBox,

                error.message ||
                "Unable to load contact messages."

            );

        }

    }


    /* =========================================================
       STATISTICS
       ========================================================= */

    function updateStatistics() {

        const total =
            allMessages.length;


        const unread =
            allMessages.filter(
                x => x.read !== true
            ).length;


        const replied =
            allMessages.filter(
                x => x.replied === true
            ).length;


        totalMessages.textContent =
            total;


        unreadMessages.textContent =
            unread;


        repliedMessages.textContent =
            replied;

    }


    /* =========================================================
       FILTER
       ========================================================= */

    document
        .querySelectorAll(".filter-btn")
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(".filter-btn")
                        .forEach(
                            b =>
                                b.classList.remove("active")
                        );


                    button.classList.add("active");


                    activeFilter =
                        button.dataset.filter;


                    renderMessages();

                }
            );

        });


    /* =========================================================
       SEARCH
       ========================================================= */

    searchInput.addEventListener(
        "input",
        function () {

            renderMessages();

        }
    );


    /* =========================================================
       RENDER
       ========================================================= */

    function renderMessages() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        let filtered =
            allMessages.filter(function (x) {

                const name =
                    String(
                        x.name || ""
                    ).toLowerCase();


                const email =
                    String(
                        x.email || ""
                    ).toLowerCase();


                const subject =
                    String(
                        x.subject || ""
                    ).toLowerCase();


                const matchesSearch =

                    !search ||

                    name.includes(search) ||

                    email.includes(search) ||

                    subject.includes(search);


                const matchesFilter =

                    activeFilter === "ALL"

                    ||

                    (
                        activeFilter === "UNREAD" &&
                        x.read !== true
                    )

                    ||

                    (
                        activeFilter === "REPLIED" &&
                        x.replied === true
                    );


                return (
                    matchesSearch &&
                    matchesFilter
                );

            });


        if (filtered.length === 0) {

            rows.innerHTML =

                `

                <div class="messages-empty">

                    <div class="messages-empty-icon">

                        <i class="fa-solid fa-inbox"></i>

                    </div>


                    <h3>
                        No messages found
                    </h3>


                    <p>
                        There are no contact messages matching
                        your current search or filter.
                    </p>

                </div>

                `;

            return;

        }


        rows.innerHTML =

            filtered
                .map(renderMessage)
                .join("");

    }


    /* =========================================================
       MESSAGE HTML
       ========================================================= */

    function renderMessage(x) {

        const isRead =
            x.read === true;


        const isReplied =
            x.replied === true;


        const cardClass =
            isReplied
                ? "replied"
                : !isRead
                    ? "unread"
                    : "";


        const initial =

            String(
                x.name ||
                "U"
            )
            .trim()
            .slice(0,1)
            .toUpperCase();


        let statusHTML;


        if (isReplied) {

            statusHTML =

                `

                <span class="status-badge status-replied">

                    <i class="fa-solid fa-check"></i>

                    REPLIED

                </span>

                `;

        }

        else if (!isRead) {

            statusHTML =

                `

                <span class="status-badge status-unread">

                    <i class="fa-solid fa-circle"></i>

                    UNREAD

                </span>

                `;

        }

        else {

            statusHTML =

                `

                <span class="status-badge status-read">

                    <i class="fa-solid fa-envelope-open"></i>

                    READ

                </span>

                `;

        }


        const previousReply =

            isReplied

            ?

            `

            <div class="previous-reply">

                <div class="previous-reply-header">

                    <div class="previous-reply-title">

                        <i class="fa-solid fa-circle-check"></i>

                        Admin Reply

                    </div>


                    <div class="previous-reply-date">

                        ${
                            x.repliedAt
                            ?
                            new Date(
                                x.repliedAt
                            ).toLocaleString()
                            :
                            ""
                        }

                    </div>

                </div>


                <p>
                    ${esc(x.adminReply || "")}
                </p>

            </div>

            `

            :

            "";


        return `

            <article
                class="message-card ${cardClass}"
                data-id="${x.id}"
            >


                <!-- MESSAGE HEADER -->

                <div class="message-header">


                    <div class="message-user">


                        <div class="message-avatar">

                            ${esc(initial)}

                        </div>


                        <div>

                            <div class="message-user-name">

                                ${esc(
                                    x.name ||
                                    "Unknown User"
                                )}

                            </div>


                            <span class="message-user-email">

                                ${esc(
                                    x.email ||
                                    ""
                                )}

                            </span>

                        </div>


                    </div>


                    <div class="message-date">

                        <i class="fa-regular fa-clock"></i>

                        ${
                            x.createdAt
                            ?
                            new Date(
                                x.createdAt
                            ).toLocaleString()
                            :
                            ""
                        }

                    </div>


                </div>


                <!-- STATUS -->

                <div class="message-status">

                    ${statusHTML}

                </div>


                <!-- SUBJECT -->

                <h3 class="message-subject">

                    ${esc(
                        x.subject ||
                        "No subject"
                    )}

                </h3>


                <!-- MESSAGE -->

                <div class="message-body-label">

                    Message

                </div>


                <div class="message-body">

                    ${esc(
                        x.message ||
                        ""
                    )}

                </div>


                <!-- PREVIOUS REPLY -->

                ${previousReply}


                <!-- REPLY -->

                <div class="reply-section">


                    <div class="reply-header">


                        <div class="reply-title">

                            <i class="fa-solid fa-reply"></i>

                            Reply to user

                        </div>


                        <div class="reply-recipient">

                            To:
                            ${esc(
                                x.email ||
                                ""
                            )}

                        </div>


                    </div>


                    <div class="reply-box">


                        <textarea
                            id="reply-${x.id}"
                            maxlength="5000"
                            placeholder="Write a professional reply to this user..."
                        ></textarea>

                </div>


                <div
                    id="reply-status-${x.id}"
                    class="reply-status"
                >
                </div>


                <div class="reply-bottom">


                    <div class="reply-hint">

                        <i class="fa-solid fa-envelope"></i>

                        Reply will be sent to the user's email.

                    </div>


                    <div class="reply-actions">


                        <button
                            type="button"
                            class="btn primary reply-btn"
                            id="reply-btn-${x.id}"
                            onclick="replyMessage(${x.id})"
                        >

                            <i class="fa-solid fa-paper-plane"></i>

                            ${
                                isReplied
                                ?
                                "Send Another"
                                :
                                "Send Reply"
                            }

                        </button>


                    </div>


                </div>


            </div>


            <!-- FOOTER -->

            <div class="message-footer">


                <div class="message-footer-info">

                    <i class="fa-solid fa-shield-halved"></i>

                    JOBSPHERE Admin Support

                </div>


                <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteMessage(${x.id})"
                >

                    <i class="fa-solid fa-trash"></i>

                    Delete Message

                </button>


            </div>


        </article>

    `;

}


/* =========================================================
   REPLY
   ========================================================= */

window.replyMessage =
    async function (id) {


        const textarea =
            document.getElementById(
                "reply-" + id
            );


        const button =
            document.getElementById(
                "reply-btn-" + id
            );


        const status =
            document.getElementById(
                "reply-status-" + id
            );


        if (
            !textarea ||
            !button ||
            !status
        ) {

            return;

        }


        const reply =
            textarea.value.trim();


        /* =================================================
           VALIDATION
           ================================================= */

        if (!reply) {

            notice(
                status,
                "Please enter a reply."
            );

            textarea.focus();

            return;

        }


        if (reply.length < 2) {

            notice(
                status,
                "Reply must contain at least 2 characters."
            );

            textarea.focus();

            return;

        }


        if (reply.length > 5000) {

            notice(
                status,
                "Reply must be 5000 characters or fewer."
            );

            textarea.focus();

            return;

        }


        /* =================================================
           CONFIRM
           ================================================= */

        const confirmed =

            confirm(
                "Send this reply to the user's email address?"
            );


        if (!confirmed) {

            return;

        }


        /* =================================================
           SENDING
           ================================================= */

        button.disabled = true;


        button.innerHTML =

            `

            <i class="fa-solid fa-spinner fa-spin"></i>

            Sending...

            `;


        status.className =
            "notice";


        status.textContent = "";


        try {


            const response =

                await apiJson(

                    "/admin/contact/" +
                    id +
                    "/reply",

                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            ...auth()

                        },

                        body: JSON.stringify({

                            reply:
                                reply

                        })

                    }

                );


            notice(

                status,

                response.message ||

                "Reply sent successfully to the user.",

                true

            );


            textarea.value = "";


            /*
             * Reload after successful email.
             */

            setTimeout(
                loadMessages,
                800
            );


        }

        catch (error) {

            console.error(
                "Reply error:",
                error
            );


            notice(

                status,

                error.message ||

                "Unable to send the reply."

            );

        }


        finally {

            button.disabled = false;


            button.innerHTML =

                `

                <i class="fa-solid fa-paper-plane"></i>

                Send Reply

                `;

        }

    };


/* =========================================================
   DELETE
   ========================================================= */

window.deleteMessage =
    async function (id) {


        const message =
            allMessages.find(
                x => x.id === id
            );


        const subject =
            message?.subject ||
            "this message";


        const confirmed =

            confirm(

                "Delete \"" +
                subject +
                "\"?\n\nThis action cannot be undone."

            );


        if (!confirmed) {

            return;

        }


        try {


            await apiJson(

                "/admin/contact/" +
                id,

                {

                    method: "DELETE",

                    headers: auth()

                }

            );


            notice(

                noticeBox,

                "Contact message deleted successfully.",

                true

            );


            await loadMessages();


        }

        catch (error) {

            console.error(
                "Delete message error:",
                error
            );


            notice(

                noticeBox,

                error.message ||

                "Unable to delete the message."

            );

        }

    };


/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadMessages();


});

</script>
