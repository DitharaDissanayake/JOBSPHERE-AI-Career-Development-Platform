<title>AI Career Advisor | JOBSPHERE</title>

<link rel="stylesheet" href="assets/css/app.css">

<style>

    /* =========================================================
       AI CAREER ADVISOR
       ========================================================= */

    .career-page {
        max-width: 1250px;
        margin: 0 auto;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .career-hero {
        position: relative;
        overflow: hidden;
        padding: 38px;
        border-radius: 24px;
        background: linear-gradient(
            135deg,
            #071d39 0%,
            #1769e0 70%,
            #4d91ee 100%
        );
        color: white;
        box-shadow: 0 20px 55px rgba(23, 105, 224, .20);
    }

    .career-hero::before {
        content: "";
        position: absolute;
        width: 330px;
        height: 330px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,.12);
        right: -100px;
        top: -150px;
    }

    .career-hero::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(255,255,255,.06);
        right: 100px;
        bottom: -160px;
    }

    .career-hero-content {
        position: relative;
        z-index: 2;
        max-width: 760px;
    }

    .ai-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.18);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .8px;
        margin-bottom: 18px;
    }

    .career-hero h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
        letter-spacing: -.8px;
    }

    .career-hero p {
        margin: 13px 0 24px;
        max-width: 650px;
        color: #dceaff;
        line-height: 1.7;
        font-size: 14px;
    }

    .hero-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .hero-actions .btn.primary {
        background: white;
        color: #1769e0;
    }

    .hero-actions .btn.primary:hover {
        background: #f0f6ff;
    }

    .hero-actions .btn.outline {
        background: rgba(255,255,255,.08);
        border-color: rgba(255,255,255,.25);
        color: white;
    }

    /* =========================================================
       NOTICE
       ========================================================= */

    .career-notice {
        margin-top: 18px;
    }

    /* =========================================================
       ANALYSIS HEADER
       ========================================================= */

    .analysis-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin: 30px 0 15px;
    }

    .analysis-header h2 {
        margin: 0;
        font-size: 21px;
    }

    .analysis-header p {
        margin: 5px 0 0;
    }

    /* =========================================================
       SCORE GRID
       ========================================================= */

    .score-grid {
        display: grid;
        grid-template-columns: 1.25fr 1fr 1fr;
        gap: 18px;
    }

    .score-card {
        position: relative;
        overflow: hidden;
        background: white;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        box-shadow: var(--shadow);
    }

    .score-card-main {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .score-ring {
        width: 105px;
        height: 105px;
        min-width: 105px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background:
            conic-gradient(
                var(--blue) calc(var(--score) * 1%),
                #e8eef7 0
            );
        position: relative;
    }

    .score-ring::after {
        content: "";
        position: absolute;
        inset: 9px;
        border-radius: 50%;
        background: white;
    }

    .score-ring-content {
        position: relative;
        z-index: 2;
        text-align: center;
    }

    .score-ring-content strong {
        display: block;
        font-size: 24px;
        color: var(--navy);
    }

    .score-ring-content span {
        font-size: 9px;
        color: var(--muted);
        font-weight: 700;
    }

    .score-card-label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .7px;
    }

    .score-card-value {
        font-size: 22px;
        font-weight: 850;
        color: var(--navy);
        margin-top: 8px;
    }

    .score-card-description {
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
    }

    .score-icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: #edf4ff;
        color: var(--blue);
        display: grid;
        place-items: center;
        margin-bottom: 15px;
    }

    /* =========================================================
       CAREER PATHS
       ========================================================= */

    .career-section {
        margin-top: 20px;
    }

    .career-path-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .career-path {
        background: white;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 23px;
        box-shadow: var(--shadow);
        transition: .2s;
    }

    .career-path:hover {
        transform: translateY(-3px);
        box-shadow: 0 20px 45px rgba(18,72,145,.12);
    }

    .path-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
    }

    .path-number {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--blue);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .path-title {
        margin: 7px 0 0;
        font-size: 20px;
        color: var(--navy);
    }

    .match-score {
        min-width: 66px;
        height: 66px;
        border-radius: 50%;
        background: #edf5ff;
        color: var(--blue);
        display: grid;
        place-items: center;
        text-align: center;
    }

    .match-score strong {
        display: block;
        font-size: 18px;
    }

    .match-score span {
        display: block;
        font-size: 8px;
        color: #71839a;
        margin-top: -2px;
    }

    .fit-box {
        background: #f8fbff;
        border: 1px solid #e4edf8;
        border-radius: 13px;
        padding: 13px;
        margin: 18px 0;
    }

    .fit-box-label {
        font-size: 10px;
        font-weight: 800;
        color: #7a8da4;
        text-transform: uppercase;
        letter-spacing: .7px;
        margin-bottom: 5px;
    }

    .fit-box p {
        margin: 0;
        font-size: 12px;
        color: #4c6079;
        line-height: 1.65;
    }

    .subheading {
        font-size: 12px;
        font-weight: 850;
        color: var(--navy);
        margin: 19px 0 9px;
    }

    .skill-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
    }

    .skill-tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 9px;
        border-radius: 8px;
        background: #f1f6fd;
        color: #41617f;
        font-size: 10px;
        font-weight: 700;
    }

    .skill-tag i {
        font-size: 8px;
        color: var(--blue);
    }

    /* =========================================================
       ROADMAP
       ========================================================= */

    .roadmap {
        margin-top: 12px;
    }

    .roadmap-step {
        position: relative;
        display: flex;
        gap: 13px;
        padding-bottom: 17px;
    }

    .roadmap-step:last-child {
        padding-bottom: 0;
    }

    .roadmap-step:not(:last-child)::before {
        content: "";
        position: absolute;
        left: 13px;
        top: 29px;
        bottom: 0;
        width: 2px;
        background: #dce8f7;
    }

    .step-number {
        width: 27px;
        height: 27px;
        min-width: 27px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #edf5ff;
        color: var(--blue);
        font-size: 10px;
        font-weight: 850;
        position: relative;
        z-index: 2;
    }

    .step-content b {
        font-size: 11px;
        color: var(--navy);
    }

    .step-content p {
        margin: 3px 0 0;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.5;
    }

    /* =========================================================
       LOWER GRID
       ========================================================= */

    .lower-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
    }

    .modern-card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 24px;
        box-shadow: var(--shadow);
    }

    .modern-card-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
    }

    .modern-card-header-icon {
        width: 39px;
        height: 39px;
        border-radius: 11px;
        background: #edf4ff;
        color: var(--blue);
        display: grid;
        place-items: center;
    }

    .modern-card-header h2 {
        margin: 0;
        font-size: 18px;
    }

    .modern-card-header p {
        margin: 3px 0 0;
        font-size: 11px;
        color: var(--muted);
    }

    .strength-item,
    .weakness-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid #edf2f8;
        font-size: 12px;
        line-height: 1.5;
    }

    .strength-item:last-child,
    .weakness-item:last-child {
        border-bottom: 0;
    }

    .item-icon {
        width: 23px;
        height: 23px;
        min-width: 23px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 10px;
    }

    .strength-icon {
        background: #eafaf3;
        color: #0b9563;
    }

    .weakness-icon {
        background: #fff1f2;
        color: #c93b48;
    }

    .section-divider {
        height: 1px;
        background: #e5edf6;
        margin: 22px 0;
    }

    /* =========================================================
       DEVELOPMENT ROADMAP
       ========================================================= */

    .development-step {
        display: flex;
        gap: 13px;
        padding: 0 0 19px;
        position: relative;
    }

    .development-step:last-of-type {
        padding-bottom: 0;
    }

    .development-step:not(:last-of-type)::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 29px;
        bottom: 0;
        width: 2px;
        background: #dce8f7;
    }

    .development-icon {
        width: 29px;
        height: 29px;
        min-width: 29px;
        border-radius: 50%;
        background: #edf5ff;
        color: var(--blue);
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 850;
        position: relative;
        z-index: 2;
    }

    .development-step b {
        font-size: 11px;
    }

    .development-step p {
        margin: 4px 0 0;
        font-size: 11px;
        line-height: 1.55;
        color: var(--muted);
    }

    /* =========================================================
       SUMMARY
       ========================================================= */

    .ai-summary {
        background: linear-gradient(
            135deg,
            #f5f9ff,
            #eef5ff
        );
        border: 1px solid #dceaff;
        border-radius: 14px;
        padding: 16px;
        margin-top: 20px;
    }

    .ai-summary-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 850;
        color: var(--blue);
        margin-bottom: 8px;
    }

    .ai-summary p {
        margin: 0;
        color: #53677f;
        font-size: 12px;
        line-height: 1.7;
    }

    /* =========================================================
       HISTORY
       ========================================================= */

    .history-section {
        margin-top: 20px;
    }

    .history-list {
        margin-top: 5px;
    }

    .career-history-item {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 22px;
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
    }

    .career-history-item:last-child {
        border-bottom: 0;
    }

    .history-main {
        min-width: 0;
    }

    .history-top {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
    }

    .history-number {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        font-weight: 800;
        color: var(--blue);
        text-transform: uppercase;
        letter-spacing: .6px;
    }

    .history-latest {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #eafaf3;
        color: #0b9563;
        font-size: 9px;
        font-weight: 800;
    }

    .history-title {
        margin: 8px 0 5px;
        color: var(--navy);
        font-size: 16px;
    }

    .history-secondary {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
    }

    .history-meta {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 10px;
    }

    .history-meta span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }

    .history-score {
        text-align: center;
    }

    .history-score-ring {
        --history-score: 0;

        width: 65px;
        height: 65px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background:
            conic-gradient(
                var(--blue) calc(var(--history-score) * 1%),
                #e8eef7 0
            );
        position: relative;
        margin: 0 auto 5px;
    }

    .history-score-ring::after {
        content: "";
        position: absolute;
        inset: 6px;
        background: white;
        border-radius: 50%;
    }

    .history-score-ring > div {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: baseline;
        justify-content: center;
    }

    .history-score-ring strong {
        color: var(--navy);
        font-size: 17px;
    }

    .history-score-ring small {
        color: var(--navy);
        font-size: 9px;
        font-weight: 800;
    }

    .history-score > span {
        font-size: 9px;
        color: var(--muted);
        font-weight: 700;
    }

    .history-action {
        display: flex;
        justify-content: flex-end;
    }

    .history-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 35px 20px;
        color: var(--muted);
        font-size: 11px;
    }

    .loading-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #dce8f7;
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .history-empty,
    .history-error {
        text-align: center;
        padding: 35px 20px;
        color: var(--muted);
    }

    .history-empty-icon {
        width: 55px;
        height: 55px;
        border-radius: 15px;
        margin: 0 auto 13px;
        display: grid;
        place-items: center;
        background: #f0f5fb;
        color: #8aa0b8;
        font-size: 20px;
    }

    .history-empty h3 {
        margin: 0 0 6px;
        color: var(--navy);
        font-size: 14px;
    }

    .history-empty p {
        margin: 0 0 15px;
        font-size: 11px;
    }

    .history-error {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: left;
    }

    .history-error > i {
        font-size: 24px;
        color: #c93b48;
    }

    .history-error strong {
        color: var(--navy);
        font-size: 13px;
    }

    .history-error p {
        margin: 5px 0 12px;
        font-size: 11px;
    }

    /* =========================================================
       EMPTY RESULT
       ========================================================= */

    .modern-empty {
        text-align: center;
        padding: 35px 20px;
        color: var(--muted);
    }

    .modern-empty-icon {
        width: 55px;
        height: 55px;
        border-radius: 15px;
        margin: 0 auto 13px;
        display: grid;
        place-items: center;
        background: #f0f5fb;
        color: #8aa0b8;
        font-size: 20px;
    }

    .modern-empty h3 {
        margin: 0 0 5px;
        color: var(--navy);
        font-size: 14px;
    }

    .modern-empty p {
        margin: 0;
        font-size: 11px;
    }

    /* =========================================================
       LOADING
       ========================================================= */

    .analysis-loading {
        display: none;
        margin-top: 20px;
        padding: 30px;
        text-align: center;
        background: white;
        border: 1px solid var(--line);
        border-radius: 20px;
    }

    .analysis-loading.show {
        display: block;
    }

    .loading-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        margin: 0 auto 13px;
        display: grid;
        place-items: center;
        background: #edf4ff;
        color: var(--blue);
        animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
            opacity: 1;
        }

        50% {
            transform: scale(1.08);
            opacity: .65;
        }
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .jobsphere-footer {
        width: 85%;
        background: #071a33;
        color: white;
        margin-top: 55px;
    }

    .footer-bottom {
        width: 100%;
        border-top: 1px solid rgba(255,255,255,.1);
    }

    .footer-bottom-container {
        max-width: 1150px;
        margin: 0 auto;
        padding: 20px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .footer-bottom p {
        margin: 0;
        color: #8fa4ba;
        font-size: 12px;
    }

    .footer-legal {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .footer-legal a {
        color: #8fa4ba;
        text-decoration: none;
        font-size: 12px;
    }

    .footer-legal a:hover {
        color: #42a5ff;
    }

    .footer-legal span {
        color: #50667d;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media(max-width: 1000px) {

        .career-page {
            max-width: 100%;
        }

        .score-grid {
            grid-template-columns: 1fr 1fr;
        }

        .score-card:first-child {
            grid-column: 1 / -1;
        }

        .career-path-grid {
            grid-template-columns: 1fr;
        }

        .career-history-item {
            grid-template-columns: 1fr auto;
        }

        .history-action {
            grid-column: 1 / -1;
            justify-content: flex-start;
        }
    }

    @media(max-width: 700px) {

        .career-hero {
            padding: 25px;
            border-radius: 18px;
        }

        .career-hero h1 {
            font-size: 27px;
        }

        .score-grid,
        .lower-grid {
            grid-template-columns: 1fr;
        }

        .score-card:first-child {
            grid-column: auto;
        }

        .score-card-main {
            flex-direction: column;
            text-align: center;
        }

        .analysis-header {
            align-items: flex-start;
            flex-direction: column;
        }

        .path-top {
            flex-direction: column;
        }

        .match-score {
            width: 66px;
        }

        .career-history-item {
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .history-score {
            text-align: left;
        }

        .history-score-ring {
            margin: 0 0 5px;
        }

        .history-action {
            grid-column: auto;
        }

        .footer-bottom-container {
            flex-direction: column;
            text-align: center;
        }
    }

</style>
```

                </div>

            </section>


            <!-- NOTICE -->

            <div
                id="n"
                class="notice career-notice">
            </div>


            <!-- LOADING -->

            <div
                id="loading"
                class="analysis-loading">

                <div class="loading-icon">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>

                </div>

                <h3>
                    Analyzing your profile...
                </h3>

                <p class="muted small">

                    Ollama AI is preparing your personalized
                    career recommendations.

                </p>

            </div>


            <!-- RESULT -->

            <div id="result"></div>


            <!-- HISTORY -->

            <section class="card history-section">

                <div class="section-head">

                    <div>

                        <h2>
                            Career Analysis History
                        </h2>

                        <p class="muted small">
                            Review your previous AI-generated
                            career recommendations.
                        </p>

                    </div>

                    <span class="tag">

                        <i class="fa-solid fa-clock-rotate-left"></i>

                        HISTORY

                    </span>

                </div>

                <div id="history">

                    <div class="history-loading">

                        <div class="loading-spinner"></div>

                        <span>
                            Loading your saved career analyses...
                        </span>

                    </div>

                </div>

            </section>

        </div>

        ` +

        closeShell();


    /* =========================================================
       HELPERS
       ========================================================= */

    function arr(x) {

        return Array.isArray(x) ? x : [];

    }


    function textValue(x) {

        if (x == null) {
            return '';
        }

        if (typeof x === 'string') {
            return x;
        }

        if (
            typeof x === 'number' ||
            typeof x === 'boolean'
        ) {
            return String(x);
        }

        if (Array.isArray(x)) {

            return x
                .map(item => textValue(item))
                .join(', ');

        }

        if (typeof x === 'object') {

            return Object.entries(x)

                .map(([key, value]) => {

                    const readableKey =
                        key
                            .replace(/([A-Z])/g, ' $1')
                            .replace(/^./, c => c.toUpperCase());

                    if (Array.isArray(value)) {

                        return `${readableKey}: ${
                            value
                                .map(v => textValue(v))
                                .join(', ')
                        }`;

                    }

                    if (
                        value &&
                        typeof value === 'object'
                    ) {

                        return `${readableKey}: ${
                            textValue(value)
                        }`;

                    }

                    return `${readableKey}: ${
                        value ?? ''
                    }`;

                })

                .join(' • ');

        }

        return String(x);

    }


    /* =========================================================
       RENDER ANALYSIS
       ========================================================= */

    function render(x) {

        let a = {};

        try {

            a = prettyJson(
                x?.analysis || x || {}
            );

        } catch (error) {

            a = {};

        }


        if (!a || typeof a !== 'object') {
            a = {};
        }


        const paths =
            Array.isArray(a.careerPaths)
                ? a.careerPaths.slice(0, 2)
                : [];


        const score =
            Math.min(
                100,
                Math.max(
                    0,
                    Number(a.overallMatchScore) || 0
                )
            );


        result.innerHTML = `

            <!-- ANALYSIS HEADER -->

            <div class="analysis-header">

                <div>

                    <h2>
                        Your Career Analysis
                    </h2>

                    <p class="muted small">
                        Personalized insights based on your JOBSPHERE profile.
                    </p>

                </div>

                <span class="tag">

                    <i class="fa-solid fa-circle-check"></i>

                    AI GENERATED

                </span>

            </div>


            <!-- SCORE CARDS -->

            <div class="score-grid">


                <!-- MATCH -->

                <div class="score-card">

                    <div class="score-card-main">

                        <div
                            class="score-ring"
                            style="--score:${score}">

                            <div class="score-ring-content">

                                <strong>
                                    ${esc(score)}%
                                </strong>

                                <span>
                                    MATCH
                                </span>

                            </div>

                        </div>


                        <div>

                            <div class="score-card-label">
                                Overall Career Match
                            </div>

                            <div class="score-card-value">

                                ${
                                    score >= 80
                                        ? 'Excellent Fit'
                                        : score >= 60
                                            ? 'Good Fit'
                                            : 'Potential Fit'
                                }

                            </div>

                            <div class="score-card-description">

                                Your overall compatibility
                                with the recommended career
                                direction.

                            </div>

                        </div>

                    </div>

                </div>


                <!-- TECHNICAL -->

                <div class="score-card">

                    <div class="score-icon">

                        <i class="fa-solid fa-code"></i>

                    </div>

                    <div class="score-card-label">
                        Technical Skill Level
                    </div>

                    <div class="score-card-value">

                        ${esc(
                            textValue(
                                a.technicalSkillLevel || '—'
                            )
                        )}

                    </div>

                    <div class="score-card-description">

                        Based on skills and evidence
                        available in your profile.

                    </div>

                </div>


                <!-- GROWTH -->

                <div class="score-card">

                    <div class="score-icon">

                        <i class="fa-solid fa-chart-line"></i>

                    </div>

                    <div class="score-card-label">
                        Growth Potential
                    </div>

                    <div class="score-card-value">

                        ${esc(
                            textValue(
                                a.growthPotential || '—'
                            )
                        )}

                    </div>

                    <div class="score-card-description">

                        AI-estimated potential for
                        professional development.

                    </div>

                </div>

            </div>


            <!-- CAREER PATHS -->

            <section class="career-section">

                <div class="analysis-header">

                    <div>

                        <h2>
                            Recommended Career Paths
                        </h2>

                        <p class="muted small">
                            The two career directions that best match your profile.
                        </p>

                    </div>

                    <span class="tag">
                        2 RECOMMENDATIONS
                    </span>

                </div>


                <div class="career-path-grid">

                    ${
                        paths.length

                            ?

                            paths.map((c, i) => {

                                const safeCareer =
                                    c && typeof c === 'object'
                                        ? c
                                        : {};

                                const match =
                                    Math.min(
                                        100,
                                        Math.max(
                                            0,
                                            Number(
                                                safeCareer.matchScore
                                            ) || 0
                                        )
                                    );

                                return `

                                    <article class="career-path">

                                        <div class="path-top">

                                            <div>

                                                <div class="path-number">

                                                    <i class="fa-solid fa-location-arrow"></i>

                                                    PATH ${i + 1}

                                                </div>

                                                <h2 class="path-title">

                                                    ${esc(
                                                        textValue(
                                                            safeCareer.title ||
                                                            'Career Path'
                                                        )
                                                    )}

                                                </h2>

                                            </div>


                                            <div class="match-score">

                                                <div>

                                                    <strong>
                                                        ${esc(match)}%
                                                    </strong>

                                                    <span>
                                                        MATCH
                                                    </span>

                                                </div>

                                            </div>

                                        </div>


                                        <!-- WHY FIT -->

                                        <div class="fit-box">

                                            <div class="fit-box-label">

                                                <i class="fa-solid fa-circle-info"></i>

                                                Why this fits you

                                            </div>

                                            <p>

                                                ${esc(
                                                    textValue(
                                                        safeCareer.whyFit ||
                                                        'No explanation was provided.'
                                                    )
                                                )}

                                            </p>

                                        </div>


                                        <!-- SKILLS -->

                                        <div class="subheading">

                                            <i class="fa-solid fa-bullseye"></i>

                                            Skills to Develop

                                        </div>


                                        <div class="skill-tags">

                                            ${
                                                arr(
                                                    safeCareer.skillGaps
                                                )
                                                    .map(s => `

                                                        <span class="skill-tag">

                                                            <i class="fa-solid fa-arrow-up"></i>

                                                            ${esc(
                                                                textValue(s)
                                                            )}

                                                        </span>

                                                    `)
                                                    .join('')

                                                ||

                                                `<span class="muted small">
                                                    No major skill gaps identified.
                                                </span>`
                                            }

                                        </div>


                                        <!-- ROADMAP -->

                                        <div class="subheading">

                                            <i class="fa-solid fa-route"></i>

                                            Career Roadmap

                                        </div>


                                        <div class="roadmap">

                                            ${
                                                arr(
                                                    safeCareer.roadmap
                                                )
                                                    .slice(0, 3)
                                                    .map((s, j) => `

                                                        <div class="roadmap-step">

                                                            <div class="step-number">

                                                                ${j + 1}

                                                            </div>

                                                            <div class="step-content">

                                                                <b>
                                                                    Stage ${j + 1}
                                                                </b>

                                                                <p>

                                                                    ${esc(
                                                                        textValue(s)
                                                                    )}

                                                                </p>

                                                            </div>

                                                        </div>

                                                    `)
                                                    .join('')

                                                ||

                                                `<p class="muted small">
                                                    No career roadmap returned.
                                                </p>`
                                            }

                                        </div>

                                    </article>

                                `;

                            }).join('')

                            :

                            `

                            <div
                                class="modern-empty"
                                style="grid-column:1/-1">

                                <div class="modern-empty-icon">

                                    <i class="fa-solid fa-robot"></i>

                                </div>

                                <h3>
                                    Career recommendations unavailable
                                </h3>

                                <p>
                                    Run the analysis again after completing your profile.
                                </p>

                            </div>

                            `

                    }

                </div>

            </section>


            <!-- LOWER CONTENT -->

            <div class="lower-grid">


                <!-- STRENGTHS -->

                <section class="modern-card">

                    <div class="modern-card-header">

                        <div class="modern-card-header-icon">

                            <i class="fa-solid fa-bolt"></i>

                        </div>

                        <div>

                            <h2>
                                Strengths & Development
                            </h2>

                            <p>
                                Key areas identified from your profile
                            </p>

                        </div>

                    </div>


                    <div class="subheading">
                        Your Strengths
                    </div>


                    ${
                        arr(a.strengths)

                            .map(item => `

                                <div class="strength-item">

                                    <div class="item-icon strength-icon">

                                        <i class="fa-solid fa-check"></i>

                                    </div>

                                    <span>

                                        ${esc(
                                            textValue(item)
                                        )}

                                    </span>

                                </div>

                            `)
                            .join('')

                        ||

                        `<p class="muted small">
                            No strengths returned.
                        </p>`
                    }


                    <div class="section-divider"></div>


                    <div class="subheading">
                        Development Needs
                    </div>


                    ${
                        arr(a.weaknesses)

                            .map(item => `

                                <div class="weakness-item">

                                    <div class="item-icon weakness-icon">

                                        <i class="fa-solid fa-arrow-up"></i>

                                    </div>

                                    <span>

                                        ${esc(
                                            textValue(item)
                                        )}

                                    </span>

                                </div>

                            `)
                            .join('')

                        ||

                        `<p class="muted small">
                            No development needs returned.
                        </p>`
                    }

                </section>


                <!-- DEVELOPMENT ROADMAP -->

                <section class="modern-card">

                    <div class="modern-card-header">

                        <div class="modern-card-header-icon">

                            <i class="fa-solid fa-route"></i>

                        </div>

                        <div>

                            <h2>
                                Your Development Roadmap
                            </h2>

                            <p>
                                Practical steps toward your career goal
                            </p>

                        </div>

                    </div>


                    ${
                        arr(
                            a.careerDevelopmentRoadmap
                        )

                        .map((step, i) => `

                            <div class="development-step">

                                <div class="development-icon">

                                    ${i + 1}

                                </div>

                                <div>

                                    <b>
                                        Step ${i + 1}
                                    </b>

                                    <p>

                                        ${esc(
                                            textValue(step)
                                        )}

                                    </p>

                                </div>

                            </div>

                        `)
                        .join('')

                        ||

                        `<p class="muted small">
                            No roadmap available.
                        </p>`
                    }


                    <!-- AI SUMMARY -->

                    <div class="ai-summary">

                        <div class="ai-summary-title">

                            <i class="fa-solid fa-wand-magic-sparkles"></i>

                            AI CAREER INSIGHT

                        </div>

                        <p>

                            ${esc(
                                textValue(
                                    a.summary ||
                                    'No additional AI summary was provided.'
                                )
                            )}

                        </p>

                    </div>

                </section>

            </div>

        `;

    }


    /* =========================================================
       RUN ANALYSIS
       ========================================================= */

    async function run() {

        go.disabled = true;

        loading.classList.add('show');

        go.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Analyzing...';


        try {

            const j =
                await apiJson(

                    '/career/analyze',

                    {
                        method: 'POST',
                        headers: auth()
                    }

                );


            render(j);


            notice(
                n,
                'Career analysis completed successfully.',
                true
            );


            await loadHistory();


            setTimeout(() => {

                result.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });

            }, 200);

        }


        catch (e) {

            console.error(
                'Career analysis error:',
                e
            );

            notice(
                n,
                e.message ||
                'Unable to analyze your career. Please try again.'
            );

        }


        finally {

            go.disabled = false;

            loading.classList.remove('show');

            go.innerHTML =
                '<i class="fa-solid fa-wand-magic-sparkles"></i> Analyze My Career';

        }

    }


    /* =========================================================
       LOAD CAREER HISTORY
       ========================================================= */

    async function loadHistory() {

        const historyBox =
            document.getElementById("history");


        historyBox.innerHTML = `

            <div class="history-loading">

                <div class="loading-spinner"></div>

                <span>
                    Loading your saved career analyses...
                </span>

            </div>

        `;


        try {

            const analyses =
                await apiJson(

                    '/career/history',

                    {
                        headers: auth()
                    }

                );


            if (
                !Array.isArray(analyses) ||
                analyses.length === 0
            ) {

                historyBox.innerHTML = `

                    <div class="history-empty">

                        <div class="history-empty-icon">

                            <i class="fa-solid fa-chart-line"></i>

                        </div>

                        <h3>
                            No career analyses yet
                        </h3>

                        <p>
                            Your completed AI career analyses will appear here.
                        </p>

                        <button
                            class="btn primary"
                            type="button"
                            onclick="document.getElementById('go').click()">

                            <i class="fa-solid fa-wand-magic-sparkles"></i>

                            Create Your First Analysis

                        </button>

                    </div>

                `;

                window.careerHistory = [];

                return;
            }


            window.careerHistory =
                analyses;


            historyBox.innerHTML =

                analyses.map((item, index) => {

                    let analysisData = {};


                    try {

                        analysisData =
                            prettyJson(
                                item?.analysis || {}
                            );

                    }

                    catch (error) {

                        console.error(
                            'Invalid history analysis JSON:',
                            error
                        );

                        analysisData = {};

                    }


                    if (
                        !analysisData ||
                        typeof analysisData !== 'object'
                    ) {

                        analysisData = {};

                    }


                    const score =
                        Math.min(
                            100,
                            Math.max(
                                0,
                                Number(
                                    analysisData.overallMatchScore
                                ) || 0
                            )
                        );


                    const paths =
                        Array.isArray(
                            analysisData.careerPaths
                        )
                            ? analysisData.careerPaths
                            : [];


                    const firstCareer =
                        paths[0]?.title ||
                        "Career recommendation";


                    const secondCareer =
                        paths[1]?.title ||
                        "";


                    const createdDate =
                        item?.createdAt
                            ? new Date(item.createdAt)
                            : null;


                    const validDate =
                        createdDate &&
                        !isNaN(createdDate.getTime());


                    const formattedDate =
                        validDate
                            ? createdDate.toLocaleDateString(
                                'en-US',
                                {
                                    year: 'numeric',
                                    month: 'short',
                                    day: 'numeric'
                                }
                            )
                            : "Unknown date";


                    const formattedTime =
                        validDate
                            ? createdDate.toLocaleTimeString(
                                'en-US',
                                {
                                    hour: '2-digit',
                                    minute: '2-digit'
                                }
                            )
                            : "";


                    return `

                        <div class="career-history-item">


                            <!-- LEFT -->

                            <div class="history-main">

                                <div class="history-top">

                                    <span class="history-number">

                                        <i class="fa-solid fa-chart-simple"></i>

                                        Analysis #${esc(
                                            item?.id ?? index + 1
                                        )}

                                    </span>


                                    ${
                                        index === 0

                                            ?

                                            `

                                            <span class="history-latest">

                                                <i class="fa-solid fa-star"></i>

                                                Latest

                                            </span>

                                            `

                                            :

                                            ''

                                    }

                                </div>


                                <h3 class="history-title">

                                    ${esc(
                                        textValue(
                                            firstCareer
                                        )
                                    )}

                                </h3>


                                ${
                                    secondCareer

                                        ?

                                        `

                                        <p class="history-secondary">

                                            <i class="fa-solid fa-arrow-right"></i>

                                            Also recommended:
                                            ${esc(
                                                textValue(
                                                    secondCareer
                                                )
                                            )}

                                        </p>

                                        `

                                        :

                                        ''

                                }


                                <div class="history-meta">

                                    <span>

                                        <i class="fa-regular fa-calendar"></i>

                                        ${esc(formattedDate)}

                                    </span>


                                    ${
                                        formattedTime

                                            ?

                                            `

                                            <span>

                                                <i class="fa-regular fa-clock"></i>

                                                ${esc(formattedTime)}

                                            </span>

                                            `

                                            :

                                            ''

                                    }

                                </div>

                            </div>


                            <!-- SCORE -->

                            <div class="history-score">

                                <div
                                    class="history-score-ring"
                                    style="
                                        --history-score:${score};
                                    ">

                                    <div>

                                        <strong>
                                            ${esc(score)}
                                        </strong>

                                        <small>
                                            %
                                        </small>

                                    </div>

                                </div>

                                <span>
                                    Career Match
                                </span>

                            </div>


                            <!-- ACTION -->

                            <div class="history-action">

                                <button
                                    class="btn outline"
                                    type="button"
                                    onclick="viewHistory(${index})">

                                    <i class="fa-regular fa-eye"></i>

                                    View Analysis

                                </button>

                            </div>


                        </div>

                    `;

                }).join("");


        }

        catch (e) {

            console.error(
                'Career history error:',
                e
            );


            historyBox.innerHTML = `

                <div class="history-error">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <div>

                        <strong>
                            Unable to load career history
                        </strong>

                        <p>
                            ${esc(
                                e?.message ||
                                'An unexpected error occurred.'
                            )}
                        </p>

                        <button
                            class="btn outline"
                            type="button"
                            onclick="loadHistory()">

                            <i class="fa-solid fa-rotate-right"></i>

                            Try Again

                        </button>

                    </div>

                </div>

            `;

        }

    }


    /* =========================================================
       VIEW HISTORY
       ========================================================= */

    function viewHistory(index) {

        if (
            !window.careerHistory ||
            !window.careerHistory[index]
        ) {

            return;

        }


        const selected =
            window.careerHistory[index];


        render(selected);


        setTimeout(() => {

            result.scrollIntoView({

                behavior: 'smooth',

                block: 'start'

            });

        }, 100);

    }


    /* =========================================================
       START
       ========================================================= */

    go.onclick = run;

    loadHistory();

</script>

</body>
</html>
