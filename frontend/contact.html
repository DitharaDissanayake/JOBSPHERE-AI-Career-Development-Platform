<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact | JOBSPHERE</title>

    <link rel="stylesheet" href="assets/css/app.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =========================================================
           CONTACT PAGE
           ========================================================= */

        .contact-page {
            max-width: 1150px;
            margin: 0 auto;
        }

        /* =========================================================
           HERO
           ========================================================= */

        .contact-hero {
            position: relative;
            overflow: hidden;
            padding: 42px;
            border-radius: 24px;

            background: linear-gradient(
                135deg,
                #071d39 0%,
                #1769e0 70%,
                #4d91ee 100%
            );

            color: white;

            box-shadow:
                0 20px 55px rgba(23, 105, 224, .20);
        }

        .contact-hero::before {
            content: "";
            position: absolute;

            width: 330px;
            height: 330px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,.12);

            right: -100px;
            top: -150px;
        }

        .contact-hero::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            border-radius: 50%;

            background: rgba(255,255,255,.06);

            right: 100px;
            bottom: -160px;
        }

        .contact-hero-content {
            position: relative;
            z-index: 2;

            max-width: 750px;
        }

        .contact-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 7px 12px;

            border-radius: 999px;

            background: rgba(255,255,255,.12);

            border: 1px solid rgba(255,255,255,.18);

            font-size: 11px;
            font-weight: 800;

            letter-spacing: .8px;

            margin-bottom: 18px;
        }

        .contact-hero h1 {
            margin: 0;

            font-size: 34px;

            line-height: 1.15;

            letter-spacing: -.8px;
        }

        .contact-hero p {
            margin: 13px 0 0;

            max-width: 650px;

            color: #dceaff;

            line-height: 1.7;

            font-size: 14px;
        }

        /* =========================================================
           NOTICE
           ========================================================= */

        .contact-notice {
            margin-top: 18px;
        }

        /* =========================================================
           MAIN GRID
           ========================================================= */

        .contact-grid {
            display: grid;

            grid-template-columns:
                .85fr
                1.35fr;

            gap: 20px;

            margin-top: 20px;
        }

        /* =========================================================
           INFORMATION CARD
           ========================================================= */

        .contact-info {
            background: white;

            border: 1px solid var(--line);

            border-radius: 20px;

            padding: 25px;

            box-shadow: var(--shadow);
        }

        .contact-info-header {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 20px;
        }

        .contact-info-icon {
            width: 42px;
            height: 42px;

            border-radius: 12px;

            background: #edf4ff;

            color: var(--blue);

            display: grid;

            place-items: center;
        }

        .contact-info-header h2 {
            margin: 0;

            font-size: 19px;
        }

        .contact-info-header p {
            margin: 3px 0 0;

            font-size: 11px;

            color: var(--muted);
        }

        .contact-info-item {
            display: flex;

            align-items: flex-start;

            gap: 12px;

            padding: 14px 0;

            border-bottom: 1px solid #edf2f8;
        }

        .contact-info-item:last-child {
            border-bottom: 0;
        }

        .contact-info-item-icon {
            width: 34px;
            height: 34px;

            min-width: 34px;

            border-radius: 10px;

            background: #f1f6fd;

            color: var(--blue);

            display: grid;

            place-items: center;

            font-size: 13px;
        }

        .contact-info-item strong {
            display: block;

            color: var(--navy);

            font-size: 12px;

            margin-bottom: 3px;
        }

        .contact-info-item span {
            color: var(--muted);

            font-size: 11px;

            line-height: 1.5;
        }

        /* =========================================================
           CONTACT FORM
           ========================================================= */

        .contact-form-card {
            background: white;

            border: 1px solid var(--line);

            border-radius: 20px;

            padding: 25px;

            box-shadow: var(--shadow);
        }

        .contact-form-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
        }

        .contact-form-header h2 {
            margin: 0;

            font-size: 19px;
        }

        .contact-form-header p {
            margin: 4px 0 0;

            color: var(--muted);

            font-size: 11px;
        }

        .contact-field {
            margin-bottom: 17px;
        }

        .contact-field label {
            display: block;

            margin-bottom: 7px;

            color: var(--navy);

            font-size: 11px;

            font-weight: 800;
        }

        .contact-field input,
        .contact-field textarea {
            width: 100%;

            box-sizing: border-box;

            border: 1px solid #dce6f2;

            border-radius: 11px;

            padding: 11px 13px;

            font-family: inherit;

            font-size: 12px;

            color: var(--navy);

            background: #fbfdff;

            outline: none;

            transition: .2s;
        }

        .contact-field input:focus,
        .contact-field textarea:focus {
            border-color: var(--blue);

            box-shadow:
                0 0 0 3px rgba(23,105,224,.08);

            background: white;
        }

        .contact-field input[readonly] {
            background: #f4f7fb;

            color: #61748b;

            cursor: not-allowed;
        }

        .contact-field textarea {
            resize: vertical;

            min-height: 150px;
        }

        .contact-submit {
            width: 100%;

            margin-top: 3px;
        }

        /* =========================================================
           NOTE
           ========================================================= */

        .contact-note {
            margin-top: 15px;

            padding: 12px;

            border-radius: 11px;

            background: #f5f9ff;

            border: 1px solid #dceaff;

            color: #60748d;

            font-size: 10px;

            line-height: 1.6;
        }

        .contact-note i {
            color: var(--blue);

            margin-right: 5px;
        }

        /* =========================================================
           FOOTER
           ========================================================= */

        .jobsphere-footer {
            width: 85%;

            background: #071a33;

            color: white;

            margin-top: 55px;
        }

        .footer-bottom {
            width: 100%;

            border-top:
                1px solid rgba(255,255,255,.1);
        }

        .footer-bottom-container {
            max-width: 1150px;

            margin: 0 auto;

            padding: 20px 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }

        .footer-bottom p {
            margin: 0;

            color: #8fa4ba;

            font-size: 12px;
        }

        .footer-legal {
            display: flex;

            gap: 12px;

            align-items: center;
        }

        .footer-legal a {
            color: #8fa4ba;

            text-decoration: none;

            font-size: 12px;
        }

        .footer-legal a:hover {
            color: #42a5ff;
        }

        .footer-legal span {
            color: #50667d;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media(max-width: 800px) {

            .contact-grid {
                grid-template-columns: 1fr;
            }

            .contact-hero {
                padding: 28px;
            }

            .contact-hero h1 {
                font-size: 28px;
            }

        }

        @media(max-width: 600px) {

            .footer-bottom-container {
                flex-direction: column;

                text-align: center;
            }

        }

    </style>

</head>


<body>

<div class="page-wrapper">

    <!-- APPLICATION -->

    <div class="app" id="app"></div>


    <!-- FOOTER -->

    <footer class="jobsphere-footer">

        <div class="footer-bottom">

            <div class="footer-bottom-container">

                <p>
                    © 2026 JOBSPHERE. All rights reserved.
                </p>

                <div class="footer-legal">

                    <a href="#">
                        Privacy Policy
                    </a>

                    <span>|</span>

                    <a href="#">
                        Terms &amp; Conditions
                    </a>

                </div>

            </div>

        </div>

    </footer>

</div>


<script src="assets/js/app.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    /* =========================================================
       REQUIRE LOGIN
       ========================================================= */

    let loggedUser;

    try {

        loggedUser = requireUser();

    } catch (error) {

        console.error("Login check failed:", error);

        return;

    }


    /* =========================================================
       PAGE SHELL
       ========================================================= */

    app.innerHTML =

        shell("Contact", "Contact") +

        `

        <div class="contact-page">


            <!-- =================================================
                 HERO
                 ================================================= -->

            <section class="contact-hero">

                <div class="contact-hero-content">

                    <div class="contact-badge">

                        <i class="fa-solid fa-headset"></i>

                        JOBSPHERE SUPPORT

                    </div>


                    <h1>
                        Let's talk.
                    </h1>


                    <p>
                        Have a question, problem or suggestion?
                        Send a message to the JOBSPHERE administrators.
                        We are here to help you get the most from
                        your career journey.
                    </p>

                </div>

            </section>


            <!-- =================================================
                 NOTICE
                 ================================================= -->

            <div
                id="contactNotice"
                class="notice contact-notice">
            </div>


            <!-- =================================================
                 MAIN GRID
                 ================================================= -->

            <div class="contact-grid">


                <!-- =================================================
                     INFORMATION
                     ================================================= -->

                <section class="contact-info">


                    <div class="contact-info-header">

                        <div class="contact-info-icon">

                            <i class="fa-solid fa-circle-info"></i>

                        </div>

                        <div>

                            <h2>
                                Contact Information
                            </h2>

                            <p>
                                We are happy to hear from you.
                            </p>

                        </div>

                    </div>


                    <div class="contact-info-item">

                        <div class="contact-info-item-icon">

                            <i class="fa-solid fa-envelope"></i>

                        </div>

                        <div>

                            <strong>
                                Email Support
                            </strong>

                            <span>
                                Contact the JOBSPHERE
                                administration team.
                            </span>

                        </div>

                    </div>


                    <div class="contact-info-item">

                        <div class="contact-info-item-icon">

                            <i class="fa-solid fa-message"></i>

                        </div>

                        <div>

                            <strong>
                                Questions & Suggestions
                            </strong>

                            <span>
                                Tell us about your experience
                                or suggest improvements.
                            </span>

                        </div>

                    </div>


                    <div class="contact-info-item">

                        <div class="contact-info-item-icon">

                            <i class="fa-solid fa-shield-halved"></i>

                        </div>

                        <div>

                            <strong>
                                Account Support
                            </strong>

                            <span>
                                Get help with your JOBSPHERE
                                account and system features.
                            </span>

                        </div>

                    </div>


                    <div class="contact-info-item">

                        <div class="contact-info-item-icon">

                            <i class="fa-solid fa-clock"></i>

                        </div>

                        <div>

                            <strong>
                                Response
                            </strong>

                            <span>
                                Your message will be reviewed
                                by the JOBSPHERE administrators.
                            </span>

                        </div>

                    </div>


                </section>


                <!-- =================================================
                     CONTACT FORM
                     ================================================= -->

                <section class="contact-form-card">


                    <div class="contact-form-header">

                        <div>

                            <h2>
                                Send us a message
                            </h2>

                            <p>
                                Your account information is filled automatically.
                            </p>

                        </div>


                        <span class="tag">

                            <i class="fa-solid fa-paper-plane"></i>

                            CONTACT

                        </span>

                    </div>


                    <form id="contactForm">


                        <!-- NAME -->

                        <div class="contact-field">

                            <label for="contactName">
                                Name
                            </label>

                            <input
                                id="contactName"
                                type="text"
                                maxlength="120"
                                readonly
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="contact-field">

                            <label for="contactEmail">
                                Email
                            </label>

                            <input
                                id="contactEmail"
                                type="email"
                                maxlength="160"
                                readonly
                            >

                        </div>


                        <!-- SUBJECT -->

                        <div class="contact-field">

                            <label for="contactSubject">
                                Subject
                            </label>

                            <input
                                id="contactSubject"
                                type="text"
                                maxlength="255"
                                placeholder="Enter the subject"
                                required
                            >

                        </div>


                        <!-- MESSAGE -->

                        <div class="contact-field">

                            <label for="contactMessage">
                                Message
                            </label>

                            <textarea
                                id="contactMessage"
                                rows="7"
                                maxlength="3000"
                                placeholder="Write your message here..."
                                required
                            ></textarea>

                        </div>


                        <!-- SEND -->

                        <button
                            type="submit"
                            class="btn primary contact-submit"
                            id="sendButton">

                            <i class="fa-solid fa-paper-plane"></i>

                            Send Message

                        </button>


                        <div class="contact-note">

                            <i class="fa-solid fa-lock"></i>

                            Your account name and email are taken
                            from your logged-in JOBSPHERE account.

                        </div>


                    </form>


                </section>


            </div>


        </div>

        ` +

        closeShell();


    /* =========================================================
       GET ELEMENTS
       ========================================================= */

    const form =
        document.getElementById("contactForm");

    const noticeBox =
        document.getElementById("contactNotice");

    const nameInput =
        document.getElementById("contactName");

    const emailInput =
        document.getElementById("contactEmail");

    const subjectInput =
        document.getElementById("contactSubject");

    const messageInput =
        document.getElementById("contactMessage");

    const sendButton =
        document.getElementById("sendButton");


    /* =========================================================
       GET LOGGED-IN USER
       ========================================================= */

    const currentUser =
        loggedUser || user();


    console.log(
        "JOBSPHERE logged-in user:",
        currentUser
    );


    /* =========================================================
       DISPLAY USER DETAILS
       ========================================================= */

    if (currentUser) {

        const userName =
            currentUser.fullName ||
            currentUser.name ||
            currentUser.username ||
            "";

        const userEmail =
            currentUser.email ||
            "";


        nameInput.value =
            userName;

        emailInput.value =
            userEmail;


        /* =============================================
           CHECK ACCOUNT INFORMATION
           ============================================= */

        if (!userName && !userEmail) {

            notice(
                noticeBox,
                "Your account information could not be loaded. Please log out and sign in again."
            );

        }
        else if (!userName) {

            notice(
                noticeBox,
                "Your name could not be loaded. Please update your profile."
            );

        }
        else if (!userEmail) {

            notice(
                noticeBox,
                "Your email could not be loaded. Please update your profile."
            );

        }

    }
    else {

        notice(
            noticeBox,
            "Your account information could not be loaded. Please log out and sign in again."
        );

    }


    /* =========================================================
       FORM SUBMIT
       ========================================================= */

    form.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();


            /* =================================================
               CLEAR NOTICE
               ================================================= */

            noticeBox.textContent = "";

            noticeBox.className =
                "notice contact-notice";


            /* =================================================
               VALUES
               ================================================= */

            const name =
                nameInput.value.trim();

            const email =
                emailInput.value.trim();

            const subject =
                subjectInput.value.trim();

            const message =
                messageInput.value.trim();


            /* =================================================
               VALIDATION
               ================================================= */

            if (!name) {

                notice(
                    noticeBox,
                    "Your name could not be loaded. Please update your profile."
                );

                return;

            }


            if (!email) {

                notice(
                    noticeBox,
                    "Your email could not be loaded. Please update your profile."
                );

                return;

            }


            if (!subject) {

                notice(
                    noticeBox,
                    "Please enter a subject."
                );

                subjectInput.focus();

                return;

            }


            if (subject.length > 255) {

                notice(
                    noticeBox,
                    "Subject must be 255 characters or fewer."
                );

                subjectInput.focus();

                return;

            }


            if (!message) {

                notice(
                    noticeBox,
                    "Please enter your message."
                );

                messageInput.focus();

                return;

            }


            if (message.length < 5) {

                notice(
                    noticeBox,
                    "Please enter a message of at least 5 characters."
                );

                messageInput.focus();

                return;

            }


            if (message.length > 3000) {

                notice(
                    noticeBox,
                    "Message must be 3000 characters or fewer."
                );

                messageInput.focus();

                return;

            }


            /* =================================================
               SEND TO BACKEND
               ================================================= */

            sendButton.disabled = true;

            sendButton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';


            try {

                const response =

                    await apiJson(

                        "/contact",

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                ...auth()

                            },

                            body: JSON.stringify({

                                name:
                                    name,

                                email:
                                    email,

                                subject:
                                    subject,

                                message:
                                    message

                            })

                        }

                    );


                /* =============================================
                   SUCCESS
                   ============================================= */

                notice(

                    noticeBox,

                    response?.message ||

                    "Thank you. Your message has been sent to JOBSPHERE.",

                    true

                );


                subjectInput.value = "";

                messageInput.value = "";


            }

            catch (error) {

                console.error(
                    "Contact form error:",
                    error
                );


                notice(

                    noticeBox,

                    error?.message ||

                    "Unable to send your message. Please try again."

                );

            }


            finally {

                sendButton.disabled = false;

                sendButton.innerHTML =

                    '<i class="fa-solid fa-paper-plane"></i> Send Message';

            }

        }

    );

});

</script>

</body>
</html>
