
<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Feedback | JOBSPHERE</title>

    <link rel="stylesheet"
          href="assets/css/app.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =====================================================
           JOBSPHERE FEEDBACK PAGE
           ===================================================== */

        .feedback-page {

            width: 100%;
            max-width: none;
            margin: 0;

        }


        /* =====================================================
           HERO
           ===================================================== */

        .feedback-hero {

            position: relative;

            overflow: hidden;

            padding: 38px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    #071d39 0%,
                    #1769e0 70%,
                    #4d91ee 100%
                );

            color: white;

            box-shadow:
                0 20px 55px
                rgba(23,105,224,.18);

        }


        .feedback-hero::before {

            content: "";

            position: absolute;

            width: 350px;

            height: 350px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,.12);

            right: -130px;

            top: -170px;

        }


        .feedback-hero::after {

            content: "";

            position: absolute;

            width: 220px;

            height: 220px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.06);

            right: 150px;

            bottom: -170px;

        }


        .feedback-hero-content {

            position: relative;

            z-index: 2;

            max-width: 760px;

        }


        .feedback-badge {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 7px 12px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.12);

            border:
                1px solid
                rgba(255,255,255,.18);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: .8px;

            margin-bottom: 17px;

        }


        .feedback-hero h2 {

            margin: 0;

            font-size: 32px;

            line-height: 1.2;

            letter-spacing: -.7px;

        }


        .feedback-hero p {

            margin: 12px 0 0;

            max-width: 680px;

            color: #dceaff;

            font-size: 14px;

            line-height: 1.7;

        }


        /* =====================================================
           CONTENT GRID
           ===================================================== */

        .feedback-grid {

            display: grid;

            grid-template-columns:
                minmax(0, 1.4fr)
                minmax(280px, .6fr);

            gap: 20px;

            margin-top: 20px;

            align-items: start;

        }


        /* =====================================================
           FORM CARD
           ===================================================== */

        .feedback-card {

            background: white;

            border:
                1px solid
                var(--line);

            border-radius: 20px;

            padding: 28px;

            box-shadow:
                var(--shadow);

        }


        .feedback-card-header {

            display: flex;

            align-items: center;

            gap: 13px;

            margin-bottom: 24px;

        }


        .feedback-icon {

            width: 45px;

            height: 45px;

            border-radius: 13px;

            display: grid;

            place-items: center;

            background: #edf4ff;

            color: var(--blue);

            font-size: 18px;

        }


        .feedback-card-header h3 {

            margin: 0;

            font-size: 19px;

            color: var(--navy);

        }


        .feedback-card-header p {

            margin: 3px 0 0;

            font-size: 11px;

            color: var(--muted);

        }


        /* =====================================================
           FIELDS
           ===================================================== */

        .feedback-field {

            margin-bottom: 22px;

        }


        .feedback-field label {

            display: block;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: 800;

            color: var(--navy);

        }


        .feedback-field label span {

            color: var(--muted);

            font-weight: 600;

        }


        .feedback-select,
        .feedback-textarea {

            width: 100%;

            box-sizing: border-box;

            border:
                1px solid
                #dbe5f0;

            border-radius: 11px;

            background: #fbfdff;

            padding: 12px 13px;

            color: var(--navy);

            font-family: inherit;

            font-size: 12px;

            outline: none;

            transition: .2s;

        }


        .feedback-select {

            cursor: pointer;

        }


        .feedback-textarea {

            resize: vertical;

            min-height: 150px;

            line-height: 1.6;

        }


        .feedback-select:focus,
        .feedback-textarea:focus {

            border-color:
                var(--blue);

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(23,105,224,.08);

        }


        /* =====================================================
           STAR RATING
           ===================================================== */

        .rating-box {

            padding: 18px;

            border-radius: 14px;

            background: #f7faff;

            border:
                1px solid
                #e1ebf7;

        }


        .stars {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .stars span {

            width: 40px;

            height: 40px;

            display: grid;

            place-items: center;

            border-radius: 10px;

            background: white;

            border:
                1px solid
                #dbe5f0;

            color: #c7d1dc;

            font-size: 23px;

            cursor: pointer;

            transition:
                .2s ease;

            user-select: none;

        }


        .stars span:hover {

            transform:
                translateY(-2px);

            border-color:
                #9bbce9;

            color:
                #6c9de0;

        }


        .stars span.on {

            color:
                #f5b301;

            background:
                #fffaf0;

            border-color:
                #f4d98d;

        }


        .rating-text {

            margin-top: 10px;

            font-size: 11px;

            color: var(--muted);

        }


        .rating-text strong {

            color: var(--blue);

        }


        /* =====================================================
           CHARACTER COUNTER
           ===================================================== */

        .textarea-bottom {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 6px;

        }


        .textarea-help {

            font-size: 10px;

            color: var(--muted);

        }


        .character-count {

            font-size: 10px;

            color: var(--muted);

        }


        /* =====================================================
           ACTIONS
           ===================================================== */

        .feedback-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 8px;

        }


        .feedback-actions button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

        }


        .feedback-actions .btn:disabled {

            opacity: .65;

            cursor: not-allowed;

        }


        /* =====================================================
           NOTICE
           ===================================================== */

        .feedback-notice {

            display: none;

            padding: 12px 14px;

            border-radius: 11px;

            margin-bottom: 20px;

            font-size: 12px;

            line-height: 1.5;

        }


        .feedback-notice.show {

            display: flex;

            align-items: center;

            gap: 9px;

        }


        .feedback-notice.error {

            background: #fff2f2;

            border:
                1px solid
                #ffd0d0;

            color: #b42318;

        }


        .feedback-notice.success {

            background: #effaf3;

            border:
                1px solid
                #c9efd5;

            color: #18733c;

        }


        /* =====================================================
           SIDE INFORMATION
           ===================================================== */

        .feedback-side {

            display: flex;

            flex-direction: column;

            gap: 16px;

        }


        .info-card {

            background: white;

            border:
                1px solid
                var(--line);

            border-radius: 18px;

            padding: 21px;

            box-shadow:
                var(--shadow);

        }


        .info-card h3 {

            margin: 0 0 13px;

            font-size: 15px;

            color: var(--navy);

        }


        .info-card p {

            margin: 0;

            font-size: 11px;

            line-height: 1.7;

            color: var(--muted);

        }


        .info-item {

            display: flex;

            gap: 11px;

            margin-top: 15px;

        }


        .info-item-icon {

            flex-shrink: 0;

            width: 32px;

            height: 32px;

            display: grid;

            place-items: center;

            border-radius: 9px;

            background: #edf4ff;

            color: var(--blue);

            font-size: 12px;

        }


        .info-item strong {

            display: block;

            font-size: 11px;

            color: var(--navy);

            margin-bottom: 3px;

        }


        .info-item span {

            display: block;

            font-size: 10px;

            line-height: 1.5;

            color: var(--muted);

        }


        /* =====================================================
           FEEDBACK BENEFITS
           ===================================================== */

        .benefit-list {

            display: flex;

            flex-direction: column;

            gap: 12px;

            margin-top: 15px;

        }


        .benefit {

            display: flex;

            align-items: flex-start;

            gap: 10px;

        }


        .benefit i {

            margin-top: 2px;

            color: #22a05a;

            font-size: 12px;

        }


        .benefit span {

            font-size: 11px;

            line-height: 1.5;

            color: #53677f;

        }


        /* =====================================================
           FOOTER — CAREER ANALYZER DESIGN
           ===================================================== */

        .feedback-footer-space {

            margin-top: 55px;

        }


        .jobsphere-footer {

            width: 100%;

            background: #071a33;

            color: white;

            margin-top: 55px;

        }


        .footer-bottom {

            width: 100%;

            border-top:
                1px solid
                rgba(255,255,255,.1);

        }


        .footer-bottom-container {

            max-width: 1150px;

            margin: 0 auto;

            padding: 20px 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .footer-bottom p {

            margin: 0;

            color: #8fa4ba;

            font-size: 12px;

        }


        .footer-legal {

            display: flex;

            gap: 12px;

            align-items: center;

        }


        .footer-legal a {

            color: #8fa4ba;

            text-decoration: none;

            font-size: 12px;

        }


        .footer-legal a:hover {

            color: #42a5ff;

        }


        .footer-legal span {

            color: #50667d;

        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media(max-width:950px) {

            .feedback-grid {

                grid-template-columns: 1fr;

            }

            .feedback-side {

                display: grid;

                grid-template-columns:
                    1fr 1fr;

            }

        }


        @media(max-width:700px) {

            .feedback-hero {

                padding: 25px;

                border-radius: 18px;

            }


            .feedback-hero h2 {

                font-size: 27px;

            }


            .feedback-card {

                padding: 20px;

            }


            .feedback-side {

                display: flex;

            }


            .stars {

                gap: 6px;

            }


            .stars span {

                width: 37px;

                height: 37px;

                font-size: 20px;

            }


            .feedback-actions {

                flex-direction: column;

            }


            .feedback-actions button {

                width: 100%;

            }


            /* CAREER ANALYZER FOOTER RESPONSIVE */

            .footer-bottom-container {

                flex-direction: column;

                text-align: center;

            }

        }

    </style>

</head>


<body>


<div class="app"
     id="app"></div>


<script src="assets/js/app.js"></script>


<script>

    /* =====================================================
       AUTHENTICATION
       ===================================================== */

    const currentUser =
        requireUser();


    /* =====================================================
       PAGE HTML
       ===================================================== */

    app.innerHTML =

        shell(
            'Share Your Feedback',
            'feedback'
        )

        + `

        <div class="feedback-page">


            <!-- =================================================
                 HERO
                 ================================================= -->

            <section class="feedback-hero">

                <div class="feedback-hero-content">

                    <span class="feedback-badge">

                        <i class="fa-solid fa-heart"></i>

                        YOUR EXPERIENCE MATTERS

                    </span>


                    <h2>

                        Help us make JOBSPHERE better.

                    </h2>


                    <p>

                        Your feedback helps us improve our
                        AI career guidance, resume tools and
                        overall user experience. Tell us what
                        you like, what could be improved and
                        what you would like to see next.

                    </p>

                </div>

            </section>



            <!-- =================================================
                 MAIN GRID
                 ================================================= -->

            <div class="feedback-grid">


                <!-- =================================================
                     FEEDBACK FORM
                     ================================================= -->

                <section class="feedback-card">


                    <div class="feedback-card-header">

                        <div class="feedback-icon">

                            <i class="fa-solid fa-comment-dots"></i>

                        </div>


                        <div>

                            <h3>

                                Share your experience

                            </h3>


                            <p>

                                It only takes a minute.

                            </p>

                        </div>

                    </div>



                    <!-- NOTICE -->

                    <div
                        id="feedbackNotice"
                        class="feedback-notice">

                    </div>



                    <!-- =================================================
                         RATING
                         ================================================= -->

                    <div class="feedback-field">

                        <label>

                            Overall Rating

                            <span>
                                *
                            </span>

                        </label>


                        <div class="rating-box">

                            <div
                                class="stars"
                                id="stars">

                                <span data-rating="1">
                                    ★
                                </span>

                                <span data-rating="2">
                                    ★
                                </span>

                                <span data-rating="3">
                                    ★
                                </span>

                                <span data-rating="4">
                                    ★
                                </span>

                                <span data-rating="5">
                                    ★
                                </span>

                            </div>


                            <div
                                class="rating-text"
                                id="ratingText">

                                Select a rating from
                                <strong>1 to 5 stars</strong>.

                            </div>

                        </div>

                    </div>



                    <!-- =================================================
                         CATEGORY
                         ================================================= -->

                    <div class="feedback-field">

                        <label for="category">

                            What would you like to give
                            feedback about?

                        </label>


                        <select
                            id="category"
                            class="feedback-select">

                            <option value="">

                                Select a category

                            </option>

                            <option value="AI Career Advisor">

                                AI Career Advisor

                            </option>

                            <option value="Resume Analyzer">

                                Resume Analyzer

                            </option>

                            <option value="Resume Builder">

                                Resume Builder

                            </option>

                            <option value="Profile">

                                My Profile

                            </option>

                            <option value="Dashboard">

                                Dashboard

                            </option>

                            <option value="User Experience">

                                Overall User Experience

                            </option>

                            <option value="Other">

                                Other

                            </option>

                        </select>

                    </div>



                    <!-- =================================================
                         COMMENT
                         ================================================= -->

                    <div class="feedback-field">

                        <label for="comment">

                            Your Feedback

                            <span>
                                (optional)
                            </span>

                        </label>


                        <textarea
                            id="comment"
                            class="feedback-textarea"
                            maxlength="1000"
                            placeholder="Tell us about your experience with JOBSPHERE. What worked well? What could we improve? What features would you like to see?"></textarea>


                        <div class="textarea-bottom">

                            <span class="textarea-help">

                                Please avoid sharing passwords
                                or sensitive information.

                            </span>


                            <span
                                class="character-count"
                                id="characterCount">

                                0 / 1000

                            </span>

                        </div>

                    </div>



                    <!-- =================================================
                         ACTIONS
                         ================================================= -->

                    <div class="feedback-actions">

                        <button
                            type="button"
                            class="btn outline"
                            id="clearFeedback">

                            <i class="fa-solid fa-rotate-left"></i>

                            Clear

                        </button>


                        <button
                            type="button"
                            class="btn primary"
                            id="sendFeedback">

                            <i class="fa-solid fa-paper-plane"></i>

                            Submit Feedback

                        </button>

                    </div>


                </section>



                <!-- =================================================
                     RIGHT SIDE
                     ================================================= -->

                <aside class="feedback-side">


                    <!-- WHY FEEDBACK -->

                    <div class="info-card">

                        <h3>

                            Why your feedback matters

                        </h3>


                        <p>

                            JOBSPHERE is continuously improving.
                            Your experience helps us understand
                            which features are useful and where
                            we can make the platform easier to use.

                        </p>


                        <div class="benefit-list">


                            <div class="benefit">

                                <i class="fa-solid fa-check"></i>

                                <span>

                                    Improve existing JOBSPHERE
                                    features.

                                </span>

                            </div>


                            <div class="benefit">

                                <i class="fa-solid fa-check"></i>

                                <span>

                                    Identify problems and usability
                                    issues.

                                </span>

                            </div>


                            <div class="benefit">

                                <i class="fa-solid fa-check"></i>

                                <span>

                                    Plan useful future career tools.

                                </span>

                            </div>


                            <div class="benefit">

                                <i class="fa-solid fa-check"></i>

                                <span>

                                    Create a better experience for
                                    all users.

                                </span>

                            </div>


                        </div>

                    </div>



                    <!-- TIPS -->

                    <div class="info-card">

                        <h3>

                            Feedback tips

                        </h3>


                        <div class="info-item">

                            <div class="info-item-icon">

                                <i class="fa-solid fa-bullseye"></i>

                            </div>


                            <div>

                                <strong>

                                    Be specific

                                </strong>

                                <span>

                                    Tell us exactly what worked
                                    or what caused difficulty.

                                </span>

                            </div>

                        </div>


                        <div class="info-item">

                            <div class="info-item-icon">

                                <i class="fa-solid fa-lightbulb"></i>

                            </div>


                            <div>

                                <strong>

                                    Share suggestions

                                </strong>

                                <span>

                                    Let us know which improvements
                                    would help you most.

                                </span>

                            </div>

                        </div>


                        <div class="info-item">

                            <div class="info-item-icon">

                                <i class="fa-solid fa-shield-halved"></i>

                            </div>


                            <div>

                                <strong>

                                    Keep it safe

                                </strong>

                                <span>

                                    Never include passwords,
                                    payment details or other
                                    sensitive information.

                                </span>

                            </div>

                        </div>

                    </div>


                </aside>


            </div>



            <!-- =================================================
                 CAREER ANALYZER STYLE FOOTER
                 ================================================= -->

            <div class="feedback-footer-space">

                <footer class="jobsphere-footer">

                    <div class="footer-bottom">

                        <div class="footer-bottom-container">

                            <p>
                                © 2026 JOBSPHERE. All rights reserved.
                            </p>

                            <div class="footer-legal">

                                <a href="#">
                                    Privacy Policy
                                </a>

                                <span>|</span>

                                <a href="#">
                                    Terms &amp; Conditions
                                </a>

                            </div>

                        </div>

                    </div>

                </footer>

            </div>


        </div>

        `

        +

        closeShell();



    /* =====================================================
       REFERENCES
       ===================================================== */

    const stars =
        document.getElementById('stars');

    const ratingText =
        document.getElementById('ratingText');

    const category =
        document.getElementById('category');

    const comment =
        document.getElementById('comment');

    const characterCount =
        document.getElementById('characterCount');

    const sendFeedback =
        document.getElementById('sendFeedback');

    const clearFeedback =
        document.getElementById('clearFeedback');

    const feedbackNotice =
        document.getElementById('feedbackNotice');


    let rating = 0;



    /* =====================================================
       RATING LABELS
       ===================================================== */

    const ratingLabels = {

        1: 'Very dissatisfied',

        2: 'Dissatisfied',

        3: 'It was okay',

        4: 'Satisfied',

        5: 'Excellent experience'

    };



    /* =====================================================
       SHOW NOTICE
       ===================================================== */

    function showNotice(
        message,
        type
    ) {

        feedbackNotice.className =
            'feedback-notice show ' +
            type;


        const icon =
            type === 'success'
                ? 'fa-circle-check'
                : 'fa-circle-exclamation';


        feedbackNotice.innerHTML =

            '<i class="fa-solid ' +
            icon +
            '"></i>' +

            '<span>' +
            esc(message) +
            '</span>';

    }



    /* =====================================================
       STAR CLICK
       ===================================================== */

    stars.addEventListener(
        'click',
        function(e) {

            const star =
                e.target.closest(
                    '[data-rating]'
                );


            if (!star) {

                return;

            }


            rating =
                Number(
                    star.dataset.rating
                );


            document
                .querySelectorAll(
                    '#stars span'
                )
                .forEach(
                    function(s) {

                        const value =
                            Number(
                                s.dataset.rating
                            );


                        s.classList.toggle(
                            'on',
                            value <= rating
                        );

                    }
                );


            ratingText.innerHTML =

                '<strong>' +
                rating +
                '/5</strong> — ' +
                ratingLabels[rating];

        }
    );



    /* =====================================================
       CHARACTER COUNTER
       ===================================================== */

    comment.addEventListener(
        'input',
        function() {

            characterCount.textContent =

                comment.value.length +
                ' / 1000';

        }
    );



    /* =====================================================
       CLEAR
       ===================================================== */

    clearFeedback.addEventListener(
        'click',
        function() {

            const confirmed =
                confirm(
                    'Are you sure you want to clear your feedback?'
                );


            if (!confirmed) {

                return;

            }


            rating = 0;

            category.value = '';

            comment.value = '';

            characterCount.textContent =
                '0 / 1000';


            document
                .querySelectorAll(
                    '#stars span'
                )
                .forEach(
                    function(s) {

                        s.classList.remove('on');

                    }
                );


            ratingText.innerHTML =

                'Select a rating from ' +
                '<strong>1 to 5 stars</strong>.';


            feedbackNotice.className =
                'feedback-notice';

            feedbackNotice.textContent = '';

        }
    );



    /* =====================================================
       SUBMIT FEEDBACK
       ===================================================== */

    sendFeedback.addEventListener(
        'click',
        async function() {


            /* ---------------------------------------------
               VALIDATION
               --------------------------------------------- */

            if (rating === 0) {

                showNotice(
                    'Please select a rating from 1 to 5 stars.',
                    'error'
                );

                return;

            }


            const commentValue =
                comment.value.trim();


            if (commentValue.length > 1000) {

                showNotice(
                    'Feedback cannot exceed 1000 characters.',
                    'error'
                );

                return;

            }



            /* ---------------------------------------------
               DISABLE BUTTON
               --------------------------------------------- */

            sendFeedback.disabled = true;


            sendFeedback.innerHTML =

                '<i class="fa-solid fa-spinner fa-spin"></i>' +
                ' Submitting...';



            try {


                /* -----------------------------------------
                   SEND TO SPRING BOOT
                   ----------------------------------------- */

                await apiJson(
                    '/feedback',
                    {

                        method: 'POST',

                        headers: {

                            ...auth(),

                            'Content-Type':
                                'application/json'

                        },

                        body:
                            JSON.stringify({

                                rating:
                                    rating,

                                comment:
                                    commentValue

                            })

                    }
                );



                /* -----------------------------------------
                   SUCCESS
                   ----------------------------------------- */

                showNotice(
                    'Thank you! Your feedback has been submitted successfully and will help us improve JOBSPHERE.',
                    'success'
                );


                rating = 0;

                category.value = '';

                comment.value = '';

                characterCount.textContent =
                    '0 / 1000';


                document
                    .querySelectorAll(
                        '#stars span'
                    )
                    .forEach(
                        function(s) {

                            s.classList.remove('on');

                        }
                    );


                ratingText.innerHTML =

                    'Select a rating from ' +
                    '<strong>1 to 5 stars</strong>.';


            }


            catch (error) {

                showNotice(
                    error.message ||
                    'Unable to submit your feedback. Please try again.',
                    'error'
                );

            }

            finally {

                sendFeedback.disabled = false;


                sendFeedback.innerHTML =

                    '<i class="fa-solid fa-paper-plane"></i>' +
                    ' Submit Feedback';

            }

        }
    );

</script>
