<script>

    /* =====================================================
       LOGIN
       ===================================================== */

    requireUser();


    /* =====================================================
       FOOTER
       ===================================================== */

    function resumeFooter() {

        return `

            <footer class="jobsphere-footer">

                <div class="footer-bottom">

                    <div class="footer-bottom-container">

                        <p>
                            © 2026 JOBSPHERE. All rights reserved.
                        </p>

                        <div class="footer-legal">

                            <a href="#">
                                Privacy Policy
                            </a>

                            <span>|</span>

                            <a href="#">
                                Terms &amp; Conditions
                            </a>

                        </div>

                    </div>

                </div>

            </footer>

        `;

    }


    /* =====================================================
       PAGE
       ===================================================== */

    app.innerHTML =

        shell(
            'Resume Analyzer',
            'resume'
        )

        +

        `

        <div class="resume-page">

            <!-- HERO -->

            <section class="resume-hero">

                <div class="resume-hero-content">

                    <div class="ai-badge">

                        <i class="fa-solid fa-wand-magic-sparkles"></i>

                        OLLAMA + ATS INTELLIGENCE

                    </div>


                    <h1>

                        Upload your resume.
                        Get a smarter career review.

                    </h1>


                    <p>

                        JOBSPHERE analyzes your resume using
                        Ollama AI and evaluates resume quality,
                        ATS compatibility, job matching, skills,
                        missing sections and practical improvements.

                    </p>


                    <div class="upload-area">

                        <label
                            class="upload-label"
                            for="file">

                            <i class="fa-solid fa-file-pdf"></i>

                            Resume PDF

                        </label>


                        <input
                            id="file"
                            class="resume-file"
                            type="file"
                            accept="application/pdf">


                        <div class="upload-help">

                            PDF only · Maximum 5 MB ·
                            Text-based PDFs work best.

                        </div>


                        <div class="resume-actions">

                            <button
                                class="btn primary"
                                id="go">

                                <i class="fa-solid fa-file-circle-check"></i>

                                Analyze My Resume

                            </button>


                            <a
                                class="btn outline"
                                href="resume-builder.html">

                                <i class="fa-solid fa-file-pen"></i>

                                Build an ATS Resume

                            </a>

                        </div>

                    </div>

                </div>

            </section>


            <!-- NOTICE -->

            <div
                id="n"
                class="notice resume-notice">
            </div>


            <!-- LOADING -->

            <div
                id="loading"
                class="resume-loading">

                <div class="loading-icon">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>

                </div>

                <h3>
                    Analyzing your resume...
                </h3>

                <p class="muted small">

                    Ollama is extracting your resume information
                    and preparing your personalized review.

                </p>

            </div>


            <!-- RESULT -->

            <div id="result"></div>


            <!-- HISTORY -->

            <section class="card history-section">

                <div class="section-head">

                    <div>

                        <h2>
                            Previous Resume Analyses
                        </h2>

                        <p class="muted small">

                            Your saved resume analyses are
                            stored separately and can be viewed again.

                        </p>

                    </div>


                    <span class="tag">

                        <i class="fa-solid fa-clock-rotate-left"></i>

                        HISTORY

                    </span>

                </div>


                <div id="history">

                    <div class="history-loading">

                        <i class="fa-solid fa-spinner fa-spin"></i>

                        Loading your previous analyses...

                    </div>

                </div>

            </section>

        </div>

        `

        +

        closeShell();


    /* =====================================================
       FOOTER
       ===================================================== */

    document
        .querySelector('.page-wrapper')
        .insertAdjacentHTML(
            'beforeend',
            resumeFooter()
        );


    /* =====================================================
       HELPERS
       ===================================================== */

    function arr(x) {

        return Array.isArray(x)
            ? x
            : [];

    }


    function getAnalysisData(item) {

        if (!item) {
            return {};
        }

        return prettyJson(
            item.analysis || item
        );

    }


    function safeScore(value) {

        const n = Number(value);

        if (!Number.isFinite(n)) {
            return 0;
        }

        return Math.min(
            100,
            Math.max(0, n)
        );

    }


    /* =====================================================
       RENDER RESULT
       ===================================================== */

    function render(x) {

        const a =
            getAnalysisData(x);


        const quality =
            safeScore(
                a.resumeQualityScore
            );


        const ats =
            safeScore(
                a.atsCompatibility
            );


        const jobs =
            Array.isArray(
                a.matchingJobs
            )
                ? a.matchingJobs
                : [];


        const skills =
            arr(
                a.skillMatchingAnalysis
            );


        const missing =
            arr(
                a.missingSections
            );


        const improvements =
            arr(
                a.improvements
            );


        result.innerHTML = `

            <!-- ANALYSIS HEADER -->

            <div class="analysis-header">

                <div>

                    <h2>
                        Your Resume Analysis
                    </h2>

                    <p class="muted small">

                        AI-powered insights based on
                        your uploaded resume.

                    </p>

                </div>


                <span class="tag">

                    <i class="fa-solid fa-circle-check"></i>

                    AI GENERATED

                </span>

            </div>


            <!-- SCORE GRID -->

            <div class="score-grid">


                <!-- QUALITY -->

                <div class="score-card">

                    <div class="score-card-main">

                        <div
                            class="score-ring"
                            style="--score:${quality}">

                            <div class="score-ring-content">

                                <strong>
                                    ${esc(quality)}%
                                </strong>

                                <span>
                                    QUALITY
                                </span>

                            </div>

                        </div>


                        <div>

                            <div class="score-card-label">

                                Resume Quality

                            </div>


                            <div class="score-card-value">

                                ${
                                    quality >= 80
                                    ? 'Excellent'
                                    : quality >= 60
                                    ? 'Good'
                                    : 'Needs Improvement'
                                }

                            </div>


                            <div class="score-card-description">

                                Overall quality based on
                                content, structure and relevance.

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ATS -->

                <div class="score-card">

                    <div class="score-icon">

                        <i class="fa-solid fa-robot"></i>

                    </div>


                    <div class="score-card-label">

                        ATS Compatibility

                    </div>


                    <div class="score-card-value">

                        ${esc(ats)}%

                    </div>


                    <div class="score-card-description">

                        How well your resume is prepared
                        for Applicant Tracking Systems.

                    </div>

                </div>


                <!-- JOBS -->

                <div class="score-card">

                    <div class="score-icon">

                        <i class="fa-solid fa-briefcase"></i>

                    </div>


                    <div class="score-card-label">

                        Matching Jobs

                    </div>


                    <div class="score-card-value">

                        ${jobs.length}

                    </div>


                    <div class="score-card-description">

                        Relevant opportunities identified
                        from the JOBSPHERE job catalog.

                    </div>

                </div>

            </div>


            <!-- MATCHING JOBS -->

            <section class="jobs-section">

                <div class="analysis-header">

                    <div>

                        <h2>
                            Recommended Job Matches
                        </h2>

                        <p class="muted small">

                            Jobs that best match your
                            resume and current skills.

                        </p>

                    </div>


                    <span class="tag">

                        ${jobs.length}
                        MATCHES

                    </span>

                </div>


                <div class="jobs-grid">

                    ${
                        jobs.length

                        ?

                        jobs.map((job, index) => {

                            if (
                                typeof job === 'string'
                            ) {

                                return `

                                    <article class="job-card">

                                        <div class="job-top">

                                            <div>

                                                <div class="job-number">

                                                    JOB ${index + 1}

                                                </div>

                                                <h3 class="job-title">

                                                    ${esc(job)}

                                                </h3>

                                            </div>

                                        </div>

                                    </article>

                                `;

                            }


                            const match =
                                safeScore(
                                    job.matchScore
                                );


                            return `

                                <article class="job-card">

                                    <div class="job-top">

                                        <div>

                                            <div class="job-number">

                                                JOB ${index + 1}

                                            </div>


                                            <h3 class="job-title">

                                                ${esc(
                                                    job.title ||
                                                    'Job Opportunity'
                                                )}

                                            </h3>


                                            <div class="job-company">

                                                <i class="fa-solid fa-building"></i>

                                                ${esc(
                                                    job.company ||
                                                    'Company not specified'
                                                )}

                                                ${
                                                    job.location
                                                    ? `

                                                        ·

                                                        ${esc(
                                                            job.location
                                                        )}

                                                      `
                                                    : ''
                                                }

                                            </div>

                                        </div>


                                        <div class="job-match">

                                            <div>

                                                <strong>
                                                    ${match}%
                                                </strong>

                                                <span>
                                                    MATCH
                                                </span>

                                            </div>

                                        </div>

                                    </div>


                                    <div class="job-reason">

                                        <strong>

                                            <i class="fa-solid fa-circle-info"></i>

                                            Why this matches

                                        </strong>

                                        <br>

                                        ${esc(
                                            job.reason ||
                                            'This role matches your resume profile.'
                                        )}

                                    </div>

                                </article>

                            `;

                        }).join('')

                        :

                        `

                            <div
                                class="modern-empty"
                                style="grid-column:1/-1">

                                <div class="modern-empty-icon">

                                    <i class="fa-solid fa-briefcase"></i>

                                </div>

                                <h3>
                                    No matching jobs found
                                </h3>

                                <p>
                                    Try improving your resume
                                    skills and experience.
                                </p>

                            </div>

                        `

                    }

                </div>

            </section>


            <!-- LOWER GRID -->

            <div class="lower-grid">


                <!-- AI ANALYSIS -->

                <section class="modern-card">

                    <div class="modern-card-header">

                        <div class="modern-card-header-icon">

                            <i class="fa-solid fa-wand-magic-sparkles"></i>

                        </div>


                        <div>

                            <h2>
                                AI Resume Analysis
                            </h2>

                            <p>
                                Overall feedback from Ollama AI
                            </p>

                        </div>

                    </div>


                    <p
                        class="muted"
                        style="
                            line-height:1.75;
                            font-size:12px;
                        ">

                        ${esc(
                            a.aiResumeAnalysis ||
                            'No AI analysis was returned.'
                        )}

                    </p>


                    <div class="section-divider"></div>


                    <div class="subheading">

                        <i class="fa-solid fa-bullseye"></i>

                        Skill Matching Analysis

                    </div>


                    ${
                        skills.length

                        ?

                        skills.map(item => `

                            <div class="list-row">

                                <div class="list-icon good-icon">

                                    <i class="fa-solid fa-check"></i>

                                </div>

                                <span>

                                    ${esc(
                                        typeof item === 'string'
                                        ? item
                                        : textValue(item)
                                    )}

                                </span>

                            </div>

                        `).join('')

                        :

                        `

                            <p class="muted small">
                                No skill matching details returned.
                            </p>

                        `

                    }

                </section>


                <!-- MISSING + IMPROVEMENTS -->

                <section class="modern-card">

                    <div class="modern-card-header">

                        <div class="modern-card-header-icon">

                            <i class="fa-solid fa-list-check"></i>

                        </div>


                        <div>

                            <h2>
                                Resume Improvements
                            </h2>

                            <p>
                                Areas that can make your resume stronger
                            </p>

                        </div>

                    </div>


                    <div class="subheading">

                        Missing Sections

                    </div>


                    ${
                        missing.length

                        ?

                        missing.map(item => `

                            <div class="list-row">

                                <div class="list-icon bad-icon">

                                    <i class="fa-solid fa-exclamation"></i>

                                </div>

                                <span>

                                    ${esc(
                                        typeof item === 'string'
                                        ? item
                                        : textValue(item)
                                    )}

                                </span>

                            </div>

                        `).join('')

                        :

                        `

                            <p class="muted small">

                                No major missing sections identified.

                            </p>

                        `

                    }


                    <div class="section-divider"></div>


                    <div class="subheading">

                        Recommended Improvements

                    </div>


                    ${
                        improvements.length

                        ?

                        improvements.map(item => `

                            <div class="list-row">

                                <div class="list-icon good-icon">

                                    <i class="fa-solid fa-arrow-up"></i>

                                </div>

                                <span>

                                    ${esc(
                                        typeof item === 'string'
                                        ? item
                                        : textValue(item)
                                    )}

                                </span>

                            </div>

                        `).join('')

                        :

                        `

                            <p class="muted small">

                                No additional improvements returned.

                            </p>

                        `

                    }


                    <a
                        class="btn primary"
                        style="margin-top:15px"
                        href="resume-builder.html">

                        <i class="fa-solid fa-file-pen"></i>

                        Improve My Resume

                    </a>

                </section>


            </div>


            <!-- AI SUMMARY -->

            <div class="ai-summary">

                <div class="ai-summary-title">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>

                    AI CAREER INSIGHT

                </div>


                <p>

                    ${esc(
                        a.summary ||
                        'No additional career insight was returned.'
                    )}

                </p>

            </div>

        `;

    }


    /* =====================================================
       ANALYZE RESUME
       ===================================================== */

    go.onclick = async function() {

        const f =
            file.files[0];


        if (!f) {

            return notice(
                n,
                'Please choose a PDF resume.'
            );

        }


        if (
            f.type !== 'application/pdf' &&
            !f.name
                .toLowerCase()
                .endsWith('.pdf')
        ) {

            return notice(
                n,
                'Only PDF resumes are supported.'
            );

        }


        if (f.size > 5242880) {

            return notice(
                n,
                'Resume must be 5 MB or smaller.'
            );

        }


        go.disabled = true;

        loading.classList.add('show');


        go.innerHTML = `

            <i class="fa-solid fa-spinner fa-spin"></i>

            Analyzing...

        `;


        const fd =
            new FormData();


        fd.append(
            'file',
            f
        );


        try {

            const j =
                await apiJson(

                    '/resumes/analyze',

                    {

                        method: 'POST',

                        headers: auth(),

                        body: fd

                    }

                );


            render(j);


            notice(

                n,

                'Resume analysis completed and saved successfully.',

                true

            );


            await loadHistory();


            setTimeout(() => {

                result.scrollIntoView({

                    behavior: 'smooth',

                    block: 'start'

                });

            }, 200);

        }


        catch (e) {

            notice(

                n,

                e.message ||
                'Unable to analyze your resume.'

            );

        }


        finally {

            go.disabled = false;

            loading.classList.remove('show');


            go.innerHTML = `

                <i class="fa-solid fa-file-circle-check"></i>

                Analyze My Resume

            `;

        }

    };


    /* =====================================================
       LOAD HISTORY
       ===================================================== */

    async function loadHistory() {

        const historyBox =
            document.getElementById(
                'history'
            );


        historyBox.innerHTML = `

            <div class="history-loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                Loading your previous analyses...

            </div>

        `;


        try {

            const response =
                await apiJson(

                    '/resumes/history',

                    {

                        headers: auth()

                    }

                );


            /*
             * SUPPORT BOTH:
             *
             * 1. [
             *   {...},
             *   {...}
             * ]
             *
             * 2. {
             *   analyses: [...]
             * }
             *
             * 3. {
             *   data: [...]
             * }
             */

            let analyses = [];


            if (Array.isArray(response)) {

                analyses =
                    response;

            }

            else if (
                Array.isArray(
                    response.analyses
                )
            ) {

                analyses =
                    response.analyses;

            }

            else if (
                Array.isArray(
                    response.data
                )
            ) {

                analyses =
                    response.data;

            }

            else if (
                Array.isArray(
                    response.history
                )
            ) {

                analyses =
                    response.history;

            }


            window.resumeHistory =
                analyses;


            if (
                analyses.length === 0
            ) {

                historyBox.innerHTML = `

                    <div class="modern-empty">

                        <div class="modern-empty-icon">

                            <i class="fa-solid fa-file-circle-plus"></i>

                        </div>


                        <h3>
                            No resume analyses yet
                        </h3>


                        <p>

                            Upload your first resume above
                            to create your first AI analysis.

                        </p>


                        <button
                            class="btn primary"
                            onclick="
                                document
                                .getElementById('file')
                                .click()
                            ">

                            <i class="fa-solid fa-upload"></i>

                            Upload Resume

                        </button>

                    </div>

                `;

                return;

            }


            historyBox.innerHTML =

                analyses
                    .map(
                        (item, index) =>
                            historyItem(
                                item,
                                index
                            )
                    )
                    .join('');

        }


        catch (e) {

            window.resumeHistory = [];


            historyBox.innerHTML = `

                <div class="history-error">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <div>

                        <strong>
                            Unable to load resume history
                        </strong>


                        <p>

                            ${esc(
                                e.message ||
                                'Please try again.'
                            )}

                        </p>


                        <button
                            class="btn outline"
                            onclick="loadHistory()">

                            <i class="fa-solid fa-rotate-right"></i>

                            Try Again

                        </button>

                    </div>

                </div>

            `;

        }

    }


    /* =====================================================
       HISTORY ITEM
       ===================================================== */

    function historyItem(
        item,
        index
    ) {

        const analysis =
            getAnalysisData(item);


        const score =
            safeScore(
                analysis.resumeQualityScore
            );


        const jobs =
            Array.isArray(
                analysis.matchingJobs
            )
                ? analysis.matchingJobs
                : [];


        const firstJob =
            jobs.length
                ? (
                    typeof jobs[0] === 'string'
                        ? jobs[0]
                        : jobs[0].title
                )
                : 'Resume Analysis';


        const secondJob =
            jobs.length > 1
                ? (
                    typeof jobs[1] === 'string'
                        ? jobs[1]
                        : jobs[1].title
                )
                : '';


        const created =
            item.createdAt
                ? new Date(item.createdAt)
                : null;


        const date =
            created &&
            !isNaN(created.getTime())

                ?

                created.toLocaleDateString(
                    'en-US',
                    {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    }
                )

                :

                'Unknown date';


        const time =
            created &&
            !isNaN(created.getTime())

                ?

                created.toLocaleTimeString(
                    'en-US',
                    {
                        hour: '2-digit',
                        minute: '2-digit'
                    }
                )

                :

                '';


        return `

            <div class="history-item">


                <div class="history-main">


                    <div class="history-top">


                        <span class="history-number">

                            <i class="fa-solid fa-chart-simple"></i>

                            Analysis #${esc(
                                item.id ??
                                index + 1
                            )}

                        </span>


                        ${
                            index === 0

                            ?

                            `

                                <span class="history-latest">

                                    <i class="fa-solid fa-star"></i>

                                    Latest

                                </span>

                            `

                            :

                            ''

                        }

                    </div>


                    <h3 class="history-title">

                        ${esc(
                            firstJob ||
                            'Resume Analysis'
                        )}

                    </h3>


                    ${
                        secondJob

                        ?

                        `

                            <p class="history-secondary">

                                <i class="fa-solid fa-arrow-right"></i>

                                Also matched:
                                ${esc(secondJob)}

                            </p>

                        `

                        :

                        ''

                    }


                    <div class="history-meta">

                        <span>

                            <i class="fa-regular fa-calendar"></i>

                            ${esc(date)}

                        </span>


                        ${
                            time

                            ?

                            `

                                <span>

                                    <i class="fa-regular fa-clock"></i>

                                    ${esc(time)}

                                </span>

                            `

                            :

                            ''

                        }

                    </div>

                </div>


                <div class="history-score">

                    <div
                        class="history-score-ring"
                        style="
                            --history-score:${score};
                        ">

                        <div>

                            <strong>
                                ${score}
                            </strong>

                            <small>
                                %
                            </small>

                        </div>

                    </div>


                    <span>
                        Resume Quality
                    </span>

                </div>


                <div class="history-action">

                    <button
                        class="btn outline"
                        onclick="
                            viewHistory(
                                ${index}
                            )
                        ">

                        <i class="fa-regular fa-eye"></i>

                        View Analysis

                    </button>

                </div>

            </div>

        `;

    }


    /* =====================================================
       VIEW HISTORY
       ===================================================== */

    function viewHistory(index) {

        if (
            !window.resumeHistory ||
            !window.resumeHistory[index]
        ) {

            notice(
                n,
                'The selected resume analysis could not be found.'
            );

            return;

        }


        const selected =
            window.resumeHistory[index];


        render(selected);


     


        setTimeout(() => {

            result.scrollIntoView({

                behavior: 'smooth',

                block: 'start'

            });

        }, 100);

    }


    /* =====================================================
       START
       ===================================================== */

    loadHistory();

</script>
