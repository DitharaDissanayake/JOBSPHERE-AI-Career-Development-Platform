<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Free Resume Builder | JOBSPHERE</title>

<link rel="stylesheet"
      href="assets/css/app.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- HTML2PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

/* =========================================================
   JOBSPHERE RESUME BUILDER
   PROFESSIONAL ATS-FRIENDLY DESIGN
========================================================= */

.resume-page {

    max-width: 1250px;

    margin: 0 auto;

}


/* =========================================================
   HERO
========================================================= */

.resume-hero {

    position: relative;

    overflow: hidden;

    padding: 38px;

    border-radius: 24px;

    background:
        linear-gradient(
            135deg,
            #071d39 0%,
            #1769e0 70%,
            #4d91ee 100%
        );

    color: white;

    box-shadow:
        0 20px 55px
        rgba(23,105,224,.20);

}

.resume-hero::before {

    content: "";

    position: absolute;

    width: 330px;

    height: 330px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.12);

    right: -100px;

    top: -150px;

}

.resume-hero::after {

    content: "";

    position: absolute;

    width: 220px;

    height: 220px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.06);

    right: 100px;

    bottom: -160px;

}

.resume-hero-content {

    position: relative;

    z-index: 2;

    max-width: 800px;

}

.ai-badge {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding: 7px 12px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.18);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: .8px;

    margin-bottom: 18px;

}

.resume-hero h2 {

    margin: 0;

    font-size: 34px;

    line-height: 1.15;

    letter-spacing: -.8px;

    color: white;

}

.resume-hero p {

    margin: 13px 0 24px;

    max-width: 700px;

    color: #dceaff;

    line-height: 1.7;

    font-size: 14px;

}

.hero-actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

}

.hero-actions .btn.primary {

    background: white;

    color: #1769e0;

}

.hero-actions .btn.primary:hover {

    background: #f0f6ff;

}


/* =========================================================
   BUILDER GRID
========================================================= */

.builder-grid {

    display: grid;

    grid-template-columns:
        minmax(0,.9fr)
        minmax(0,1.1fr);

    gap: 20px;

    margin-top: 20px;

    align-items: start;

}


/* =========================================================
   BUILDER CARD
========================================================= */

.builder-card {

    background: white;

    border:
        1px solid
        var(--line);

    border-radius: 20px;

    padding: 24px;

    box-shadow:
        var(--shadow);

}

.builder-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 20px;

}

.builder-header-left {

    display: flex;

    align-items: center;

    gap: 12px;

}

.builder-header-icon {

    width: 42px;

    height: 42px;

    border-radius: 12px;

    display: grid;

    place-items: center;

    background: #edf4ff;

    color: var(--blue);

    font-size: 17px;

}

.builder-header h3 {

    margin: 0;

    font-size: 18px;

    color: var(--navy);

}

.builder-header p {

    margin: 3px 0 0;

    font-size: 11px;

    color: var(--muted);

}


/* =========================================================
   FORM SECTIONS
========================================================= */

.form-section {

    padding: 18px 0;

    border-bottom:
        1px solid
        #edf2f8;

}

.form-section:first-of-type {

    padding-top: 0;

}

.form-section:last-of-type {

    border-bottom: 0;

}

.form-section-title {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 14px;

    color: var(--navy);

    font-size: 12px;

    font-weight: 850;

}

.form-section-title i {

    color: var(--blue);

}


/* =========================================================
   FORM GRID
========================================================= */

.form-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 13px;

}

.field {

    margin-bottom: 13px;

}

.field:last-child {

    margin-bottom: 0;

}

.field label {

    display: block;

    margin-bottom: 6px;

    font-size: 11px;

    font-weight: 800;

    color: var(--navy);

}

.field label span {

    color: #91a0b2;

    font-weight: 600;

}

.input,
.builder-card textarea {

    width: 100%;

    box-sizing: border-box;

    border:
        1px solid
        #dbe5f0;

    border-radius: 10px;

    background:
        #fbfdff;

    padding: 11px 12px;

    color: var(--navy);

    font-family: inherit;

    font-size: 12px;

    outline: none;

    transition: .2s;

}

.builder-card textarea {

    resize: vertical;

    min-height: 88px;

    line-height: 1.55;

}

.input:focus,
.builder-card textarea:focus {

    border-color:
        var(--blue);

    background:
        white;

    box-shadow:
        0 0 0 3px
        rgba(23,105,224,.08);

}

.field-help {

    display: block;

    margin-top: 5px;

    color: var(--muted);

    font-size: 10px;

    line-height: 1.4;

}


/* =========================================================
   ACTIONS
========================================================= */

.builder-actions {

    display: flex;

    gap: 9px;

    flex-wrap: wrap;

    padding-top: 20px;

}

.builder-actions .btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

}


/* =========================================================
   TIP
========================================================= */

.builder-tip {

    margin-top: 16px;

    padding: 13px;

    border-radius: 12px;

    background:
        #f5f9ff;

    border:
        1px solid
        #dceaff;

    color:
        #53677f;

    font-size: 11px;

    line-height: 1.6;

}

.builder-tip strong {

    display: block;

    color:
        var(--blue);

    margin-bottom: 4px;

}


/* =========================================================
   PREVIEW
========================================================= */

.preview-wrapper {

    position: sticky;

    top: 20px;

}

.preview-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 12px;

}

.preview-header h3 {

    margin: 0;

    font-size: 18px;

    color: var(--navy);

}

.preview-label {

    display: inline-flex;

    align-items: center;

    gap: 6px;

    padding: 6px 10px;

    border-radius: 999px;

    background:
        #edf5ff;

    color:
        var(--blue);

    font-size: 9px;

    font-weight: 850;

    letter-spacing: .5px;

}


/* =========================================================
   ATS RESUME PAPER
========================================================= */

.resume-paper {

    background: #ffffff;

    border:
        1px solid
        #dce5ef;

    border-radius: 4px;

    min-height: 1000px;

    padding:
        50px 55px;

    box-shadow:
        0 18px 45px
        rgba(17,54,91,.12);

    color:
        #202c3b;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    text-align: left;

    box-sizing: border-box;

    overflow: visible;

}


/* =========================================================
   RESUME HEADER
========================================================= */

.resume-name {

    margin: 0;

    font-size: 30px;

    font-weight: 700;

    color:
        #111827;

    letter-spacing:
        -.3px;

}

.resume-contact {

    margin:
        7px 0 0;

    font-size:
        10px;

    color:
        #4b5563;

    line-height:
        1.6;

    white-space:
        pre-line;

}

.resume-line {

    height: 1.5px;

    background:
        #1f2937;

    margin:
        16px 0 22px;

}


/* =========================================================
   RESUME SECTIONS
========================================================= */

.resume-section {

    margin-bottom:
        21px;

    page-break-inside:
        avoid;

    break-inside:
        avoid;

}

.resume-section h4 {

    margin:
        0 0 8px;

    padding-bottom:
        5px;

    border-bottom:
        1px solid
        #d8dee6;

    font-size:
        11px;

    font-weight:
        700;

    text-transform:
        uppercase;

    letter-spacing:
        .8px;

    color:
        #111827;

}

.resume-section p {

    margin:
        0;

    font-size:
        10.5px;

    color:
        #374151;

    line-height:
        1.65;

    white-space:
        pre-line;

    word-break:
        break-word;

}

.resume-placeholder {

    color:
        #9aa8b7 !important;

    font-style:
        italic;

}


/* =========================================================
   REFERENCE BLOCK
========================================================= */

.reference-block {

    margin-bottom:
        12px;

    page-break-inside:
        avoid;

    break-inside:
        avoid;

}

.reference-name {

    font-size:
        10.5px;

    font-weight:
        700;

    color:
        #111827;

    margin-bottom:
        2px;

}

.reference-details {

    font-size:
        10px;

    line-height:
        1.55;

    color:
        #4b5563;

    white-space:
        pre-line;

}


/* =========================================================
   COMPLETION
========================================================= */

.completion-card {

    margin-top: 20px;

    padding: 18px;

    background: white;

    border:
        1px solid
        var(--line);

    border-radius: 18px;

    box-shadow:
        var(--shadow);

}

.completion-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 9px;

}

.completion-top strong {

    font-size:
        12px;

    color:
        var(--navy);

}

.completion-percent {

    font-size:
        12px;

    font-weight:
        850;

    color:
        var(--blue);

}

.completion-bar {

    height:
        8px;

    overflow:
        hidden;

    border-radius:
        999px;

    background:
        #e9eff6;

}

.completion-bar i {

    display:
        block;

    width:
        0%;

    height:
        100%;

    border-radius:
        inherit;

    background:
        linear-gradient(
            90deg,
            #1769e0,
            #4d91ee
        );

    transition:
        width .3s ease;

}

.completion-text {

    margin-top:
        7px;

    color:
        var(--muted);

    font-size:
        10px;

}


/* =========================================================
   PDF GENERATION
   IMPORTANT:
   Do NOT move, clone or resize the live preview.
========================================================= */

.pdf-generating {

    pointer-events:
        none !important;

    opacity:
        1 !important;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px) {

    .resume-page {

        max-width: 100%;

    }

    .builder-grid {

        grid-template-columns:
            1fr;

    }

    .preview-wrapper {

        position:
            static;

    }

}


@media(max-width:700px) {

    .resume-hero {

        padding:
            25px;

        border-radius:
            18px;

    }

    .resume-hero h2 {

        font-size:
            27px;

    }

    .form-grid {

        grid-template-columns:
            1fr;

    }

    .builder-card {

        padding:
            18px;

    }

    .resume-paper {

        padding:
            30px 25px;

        min-height:
            auto;

    }

    .resume-name {

        font-size:
            25px;

    }

}


/* =========================================================
   PRINT
========================================================= */

@media print {

    body {

        background:
            white !important;

    }

    .side,
    .top,
    .no-print,
    .resume-hero,
    .completion-card,
    .preview-header {

        display:
            none !important;

    }

    .main {

        margin:
            0 !important;

        padding:
            0 !important;

        width:
            100% !important;

    }

    .resume-page {

        max-width:
            none !important;

        margin:
            0 !important;

    }

    .builder-grid {

        display:
            block !important;

        margin:
            0 !important;

    }

    .preview-wrapper {

        position:
            static !important;

    }

    .resume-paper {

        border:
            0 !important;

        box-shadow:
            none !important;

        border-radius:
            0 !important;

        min-height:
            auto !important;

        width:
            100% !important;

        box-sizing:
            border-box !important;

        padding:
            35px 45px !important;

    }

    @page {

        size:
            A4;

        margin:
            0;

    }

}

</style>

</head>


<body>


<div class="app" id="app"></div>


<script src="assets/js/app.js"></script>


<script>

/* =========================================================
   LOGIN CHECK
========================================================= */

const u = requireUser();


/* =========================================================
   BUILD PAGE
========================================================= */

document.getElementById("app").innerHTML =

    shell(
        "Free Resume Builder",
        "resume"
    )

    +

    `

    <div class="resume-page">


        <!-- =================================================
             HERO
        ================================================= -->

        <section class="resume-hero">

            <div class="resume-hero-content">

                <div class="ai-badge">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>

                    FREE ATS RESUME BUILDER

                </div>


                <h2>

                    Build a clean,
                    professional resume.

                </h2>


                <p>

                    Create a professional,
                    ATS-friendly resume using
                    your JOBSPHERE profile information.
                    Your resume preview updates instantly
                    as you type.

                </p>


                <div class="hero-actions">

                    <button
                        class="btn primary"
                        type="button"
                        onclick="printResume()">

                        <i class="fa-solid fa-file-pdf"></i>

                        Generate PDF

                    </button>

                </div>

            </div>

        </section>



        <!-- =================================================
             BUILDER
        ================================================= -->

        <div class="builder-grid">


            <!-- =================================================
                 LEFT
            ================================================= -->

            <section class="builder-card">


                <div class="builder-header">

                    <div class="builder-header-left">

                        <div class="builder-header-icon">

                            <i class="fa-solid fa-pen-to-square"></i>

                        </div>


                        <div>

                            <h3>
                                Resume Information
                            </h3>

                            <p>
                                Complete the sections below
                            </p>

                        </div>

                    </div>

                </div>



                <!-- =================================================
                     PERSONAL INFORMATION
                ================================================= -->

                <div class="form-section">

                    <div class="form-section-title">

                        <i class="fa-solid fa-user"></i>

                        Personal Information

                    </div>


                    <div class="form-grid">


                        <div class="field">

                            <label>
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                class="input"
                                placeholder="Your full name">

                        </div>


                        <div class="field">

                            <label>
                                Email & Phone
                            </label>

                            <input
                                type="text"
                                id="contact"
                                class="input"
                                placeholder="email@example.com · 0771234567">

                        </div>


                    </div>

                </div>



                <!-- =================================================
                     PROFESSIONAL SUMMARY
                ================================================= -->

                <div class="form-section">

                    <div class="form-section-title">

                        <i class="fa-solid fa-align-left"></i>

                        Professional Summary

                    </div>


                    <div class="field">

                        <textarea
                            id="summary"
                            rows="5"
                            placeholder="Write a concise professional summary focused on your experience, strengths, skills and career direction."></textarea>


                        <small class="field-help">

                            Use keywords related to your target job.
                            Avoid personal statements and unnecessary information.

                        </small>

                    </div>

                </div>



                <!-- =================================================
                     EDUCATION
                ================================================= -->

                <div class="form-section">

                    <div class="form-section-title">

                        <i class="fa-solid fa-graduation-cap"></i>

                        Education

                    </div>


                    <div class="field">

                        <textarea
                            id="education"
                            rows="5"
                            placeholder="BSc (Hons) in Information Technology&#10;University of ...&#10;2022 - 2026&#10;Relevant modules, achievements or GPA"></textarea>

                    </div>

                </div>



                <!-- =================================================
                     SKILLS
                ================================================= -->

                <div class="form-section">

                    <div class="form-section-title">

                        <i class="fa-solid fa-code"></i>

                        Technical Skills

                    </div>


                    <div class="field">

                        <textarea
                            id="skills"
                            rows="5"
                            placeholder="Java, Spring Boot, JavaScript, HTML5, CSS3, MySQL, Git, REST APIs, SQL"></textarea>


                        <small class="field-help">

                            Use standard skill names and separate
                            skills with commas or new lines.

                        </small>

                    </div>

                </div>



                <!-- =================================================
                     EXPERIENCE
                ================================================= -->

                <div class="form-section">

                    <div class="form-section-title">

                        <i class="fa-solid fa-briefcase"></i>

                        Professional Experience

                    </div>


                    <div class="field">

                        <textarea
                            id="experience"
                            rows="7"
                            placeholder="Software Engineering Intern&#10;ABC Technologies&#10;Jan 2026 - Jun 2026&#10;Developed REST APIs using Spring Boot&#10;Improved application performance by 20%&#10;Worked with Git and MySQL"></textarea>


                        <small class="field-help">

                            Focus on achievements.
                            Use measurable results where possible.

                        </small>

                    </div>

                </div>



                <!-- =================================================
                     PROJECTS
                ================================================= -->

                <div class="form-section">

                    <div class="form-section-title">

                        <i class="fa-solid fa-diagram-project"></i>

                        Projects

                    </div>


                    <div class="field">

                        <textarea
                            id="projects"
                            rows="7"
                            placeholder="JOBSPHERE - AI Smart Career Development Platform&#10;Technologies: Java, Spring Boot, MySQL, JavaScript&#10;Developed an AI-assisted career guidance platform&#10;Implemented profile management, interview simulation and resume generation"></textarea>


                        <small class="field-help">

                            Mention project name,
                            technologies, responsibilities and outcomes.

                        </small>

                    </div>

                </div>



                <!-- =================================================
                     CERTIFICATIONS
                ================================================= -->

                <div class="form-section">

                    <div class="form-section-title">

                        <i class="fa-solid fa-certificate"></i>

                        Certifications

                    </div>


                    <div class="field">

                        <textarea
                            id="certs"
                            rows="5"
                            placeholder="AWS Cloud Practitioner - Amazon Web Services - 2026&#10;Java Programming - Oracle - 2025"></textarea>

                    </div>

                </div>



                <!-- =================================================
                     REFERENCES
                ================================================= -->

                <div class="form-section">

                    <div class="form-section-title">

                        <i class="fa-solid fa-user-tie"></i>

                        References

                    </div>


                    <div class="field">

                        <label>

                            Reference 1

                            <span>
                                (Optional)
                            </span>

                        </label>

                        <textarea
                            id="reference1"
                            rows="4"
                            placeholder="Dr. John Perera&#10;Senior Lecturer, Department of ICT&#10;University of Example&#10;john@example.com · 0771234567"></textarea>

                    </div>


                    <div class="field">

                        <label>

                            Reference 2

                            <span>
                                (Optional)
                            </span>

                        </label>

                        <textarea
                            id="reference2"
                            rows="4"
                            placeholder="Ms. Jane Silva&#10;Project Manager, ABC Technologies&#10;jane@example.com · 0711234567"></textarea>

                    </div>


                    <small class="field-help">

                        Include professional or academic references
                        only with their permission.

                    </small>

                </div>



                <!-- =================================================
                     ACTIONS
                ================================================= -->

                <div class="builder-actions">


                    <button
                        type="button"
                        class="btn primary"
                        onclick="printResume()">

                        <i class="fa-solid fa-file-pdf"></i>

                        Download Resume PDF

                    </button>


                    <button
                        type="button"
                        class="btn outline"
                        onclick="clearResume()">

                        <i class="fa-solid fa-rotate-left"></i>

                        Clear

                    </button>

                </div>



                <!-- =================================================
                     ATS TIP
                ================================================= -->

                <div class="builder-tip">

                    <strong>

                        <i class="fa-solid fa-lightbulb"></i>

                        ATS Resume Tip

                    </strong>

                    Use standard headings such as
                    Professional Summary, Education,
                    Technical Skills, Professional Experience,
                    Projects, Certifications and References.
                    Avoid photos, tables, graphics, progress bars
                    and complicated layouts inside your CV.

                </div>


            </section>



            <!-- =================================================
                 RIGHT SIDE
            ================================================= -->

            <section class="preview-wrapper">


                <div class="preview-header no-print">

                    <div>

                        <h3>
                            Live Resume Preview
                        </h3>

                    </div>


                    <span class="preview-label">

                        <i class="fa-solid fa-eye"></i>

                        ATS FRIENDLY

                    </span>

                </div>



                <!-- =================================================
                     RESUME PAPER
                ================================================= -->

                <div
                    class="resume-paper"
                    id="preview">


                    <!-- HEADER -->

                    <h1
                        class="resume-name"
                        id="pname">

                        Your Name

                    </h1>


                    <p
                        class="resume-contact"
                        id="pcontact">

                        Email · Phone

                    </p>


                    <div class="resume-line"></div>



                    <!-- SUMMARY -->

                    <section class="resume-section">

                        <h4>
                            Professional Summary
                        </h4>

                        <p
                            id="psummary"
                            class="resume-placeholder">

                            Add a concise professional summary.

                        </p>

                    </section>



                    <!-- EDUCATION -->

                    <section class="resume-section">

                        <h4>
                            Education
                        </h4>

                        <p
                            id="peducation"
                            class="resume-placeholder">

                            Add your education details.

                        </p>

                    </section>



                    <!-- SKILLS -->

                    <section class="resume-section">

                        <h4>
                            Technical Skills
                        </h4>

                        <p
                            id="pskills"
                            class="resume-placeholder">

                            Add your technical skills.

                        </p>

                    </section>



                    <!-- EXPERIENCE -->

                    <section class="resume-section">

                        <h4>
                            Professional Experience
                        </h4>

                        <p
                            id="pexperience"
                            class="resume-placeholder">

                            Add your professional experience.

                        </p>

                    </section>



                    <!-- PROJECTS -->

                    <section class="resume-section">

                        <h4>
                            Projects
                        </h4>

                        <p
                            id="pprojects"
                            class="resume-placeholder">

                            Add your relevant projects.

                        </p>

                    </section>



                    <!-- CERTIFICATIONS -->

                    <section class="resume-section">

                        <h4>
                            Certifications
                        </h4>

                        <p
                            id="pcerts"
                            class="resume-placeholder">

                            Add relevant certifications.

                        </p>

                    </section>

/* =========================================================

========================================================= */

const name =
    document.getElementById("name");

const contact =
    document.getElementById("contact");

const summary =
    document.getElementById("summary");

const education =
    document.getElementById("education");

const skills =
    document.getElementById("skills");

const experience =
    document.getElementById("experience");

const projects =
    document.getElementById("projects");

const certs =
    document.getElementById("certs");

const reference1 =
    document.getElementById("reference1");

const reference2 =
    document.getElementById("reference2");



/* =========================================================
   DEFAULT USER DATA
========================================================= */

name.value =
    u.fullName || "";



/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile() {

    try {

        const j =
            await apiJson(
                "/profile",
                {
                    headers: auth()
                }
            );


        if (
            !j.exists ||
            !j.profile
        ) {

            update();

            return;

        }


        const p =
            j.profile;


        contact.value =
            [
                u.email,
                p.phone
            ]
            .filter(Boolean)
            .join(" · ");


        education.value =
            p.education || "";


        skills.value =
            p.skills || "";


        experience.value =
            p.experience || "";


        projects.value =
            p.projects || "";


        certs.value =
            p.certifications || "";


        summary.value =
            p.headline || "";


        update();

    }

    catch (error) {

        console.error(
            "Profile loading error:",
            error
        );

        update();

    }

}



/* =========================================================
   PREVIEW HELPER
========================================================= */

function setPreview(
    element,
    value,
    placeholder
) {

    element.textContent =
        value || placeholder;


    element.classList.toggle(
        "resume-placeholder",
        !value
    );

}



/* =========================================================
   REFERENCE PREVIEW
========================================================= */

function updateReferencePreview(
    input,
    output
) {

    const value =
        input.value.trim();


    if (!value) {

        output.innerHTML =
            "";

        return false;

    }


    const lines =
        value
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(Boolean);


    if (!lines.length) {

        output.innerHTML =
            "";

        return false;

    }


    output.innerHTML =
        "";


    const referenceName =
        document.createElement(
            "div"
        );


    referenceName.className =
        "reference-name";


    referenceName.textContent =
        lines[0];


    output.appendChild(
        referenceName
    );


    if (
        lines.length > 1
    ) {

        const details =
            document.createElement(
                "div"
            );


        details.className =
            "reference-details";


        details.textContent =
            lines
                .slice(1)
                .join("\n");


        details.style.whiteSpace =
            "pre-line";


        output.appendChild(
            details
        );

    }


    return true;

}



/* =========================================================
   UPDATE PREVIEW
========================================================= */

function update() {


    /* NAME */

    document.getElementById(
        "pname"
    ).textContent =

        name.value ||
        "Your Name";


    /* CONTACT */

    document.getElementById(
        "pcontact"
    ).textContent =

        contact.value ||
        "Email · Phone";


    /* SUMMARY */

    setPreview(

        document.getElementById(
            "psummary"
        ),

        summary.value,

        "Add a concise professional summary."

    );


    /* EDUCATION */

    setPreview(

        document.getElementById(
            "peducation"
        ),

        education.value,

        "Add your education details."

    );


    /* SKILLS */

    setPreview(

        document.getElementById(
            "pskills"
        ),

        skills.value,

        "Add your technical skills."

    );


    /* EXPERIENCE */

    setPreview(

        document.getElementById(
            "pexperience"
        ),

        experience.value,

        "Add your professional experience."

    );


    /* PROJECTS */

    setPreview(

        document.getElementById(
            "pprojects"
        ),

        projects.value,

        "Add your relevant projects."

    );


    /* CERTIFICATIONS */

    setPreview(

        document.getElementById(
            "pcerts"
        ),

        certs.value,

        "Add relevant certifications."

    );


    /* REFERENCES */

    const hasReference1 =
        updateReferencePreview(

            reference1,

            document.getElementById(
                "preference1"
            )

        );


    const hasReference2 =
        updateReferencePreview(

            reference2,

            document.getElementById(
                "preference2"
            )

        );


    const referenceSection =
        document.getElementById(
            "referencesPreviewSection"
        );


    if (
        hasReference1 ||
        hasReference2
    ) {

        referenceSection.style.display =
            "block";

    }

    else {

        referenceSection.style.display =
            "none";

    }


    /* COMPLETION */

    updateCompletion();

}



/* =========================================================
   COMPLETION
========================================================= */

function updateCompletion() {


    /* References are optional
       and are NOT counted. */

    const fields = [

        name.value.trim(),

        contact.value.trim(),

        summary.value.trim(),

        education.value.trim(),

        skills.value.trim(),

        experience.value.trim(),

        projects.value.trim(),

        certs.value.trim()

    ];


    const completed =
        fields.filter(
            Boolean
        ).length;


    const percent =
        Math.round(

            completed /
            fields.length *
            100

        );


    document.getElementById(
        "completionPercent"
    ).textContent =

        percent + "%";


    document.getElementById(
        "completionBar"
    ).style.width =

        percent + "%";


    let message =
        "Start filling your resume information.";


    if (
        percent === 100
    ) {

        message =
            "Excellent! Your resume is complete and ready to download.";

    }

    else if (
        percent >= 75
    ) {

        message =
            "Almost finished! Complete the remaining sections.";

    }

    else if (
        percent >= 50
    ) {

        message =
            "Good progress! Add more information to strengthen your resume.";

    }

    else if (
        percent >= 25
    ) {

        message =
            "Keep going! Complete more sections for a stronger resume.";

    }


    document.getElementById(
        "completionText"
    ).textContent =

        message;

}



/* =========================================================
   INPUT LISTENERS
========================================================= */

document
    .querySelectorAll(
        "#name, #contact, #summary, #education, #skills, #experience, #projects, #certs, #reference1, #reference2"
    )
    .forEach(

        field => {

            field.addEventListener(
                "input",
                update
            );

        }

    );



/* =========================================================
   GENERATE PDF
   ONLY THE LIVE RESUME PREVIEW IS INCLUDED
========================================================= */

async function printResume() {


    /* -----------------------------------------------------
       Update live preview
    ----------------------------------------------------- */

    update();


    /* -----------------------------------------------------
       Get the actual live resume preview
    ----------------------------------------------------- */

    const resume =
        document.getElementById(
            "preview"
        );


    if (!resume) {

        alert(
            "Resume preview could not be found."
        );

        return;

    }


    /* -----------------------------------------------------
       Check HTML2PDF
    ----------------------------------------------------- */

    if (
        typeof html2pdf ===
        "undefined"
    ) {

        alert(
            "PDF generator is not loaded. Please refresh the page."
        );

        return;

    }


    /* -----------------------------------------------------
       Safe PDF filename
    ----------------------------------------------------- */

    let resumeName =

        (
            name.value ||
            u.fullName ||
            "JOBSPHERE_Resume"
        )

        .trim()

        .replace(
            /[^a-z0-9]+/gi,
            "_"
        )

        .replace(
            /^_+|_+$/g,
            ""
        );


    if (!resumeName) {

        resumeName =
            "JOBSPHERE_Resume";

    }


    /* -----------------------------------------------------
       Disable PDF buttons while generating
    ----------------------------------------------------- */

    const buttons =
        document.querySelectorAll(
            'button[onclick="printResume()"]'
        );


    const originalButtonHTML = [];


    buttons.forEach(
        (button, index) => {

            originalButtonHTML[index] =
                button.innerHTML;

            button.disabled =
                true;

            button.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Generating PDF...';

        }
    );


    try {


        /* -------------------------------------------------
           Keep live preview visually unchanged
        ------------------------------------------------- */

        resume.classList.add(
            "pdf-generating"
        );


        /* -------------------------------------------------
           Wait for browser rendering
        ------------------------------------------------- */

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    resolve
                )
        );


        await new Promise(
            resolve =>
                requestAnimationFrame(
                    resolve
                )
        );


        /* -------------------------------------------------
           Get actual dimensions of live preview
        ------------------------------------------------- */

        const resumeWidth =
            Math.max(
                resume.scrollWidth,
                resume.offsetWidth,
                resume.clientWidth
            );


        const resumeHeight =
            Math.max(
                resume.scrollHeight,
                resume.offsetHeight,
                resume.clientHeight
            );


        /* -------------------------------------------------
           PDF configuration
        ------------------------------------------------- */

        const options = {

            margin: 0,

            filename:
                `${resumeName}_Resume.pdf`,

            image: {

                type:
                    "jpeg",

                quality:
                    1

            },

            html2canvas: {

                scale:
                    2,

                useCORS:
                    true,

                allowTaint:
                    false,

                backgroundColor:
                    "#ffffff",

                scrollX:
                    0,

                scrollY:
                    0,

                windowWidth:
                    Math.max(
                        document.documentElement.clientWidth,
                        resumeWidth
                    ),

                windowHeight:
                    Math.max(
                        window.innerHeight,
                        resumeHeight
                    ),

                logging:
                    false,

                imageTimeout:
                    15000

            },

            jsPDF: {

                unit:
                    "mm",

                format:
                    "a4",

                orientation:
                    "portrait",

                compress:
                    true

            },

            pagebreak: {

                mode: [
                    "css",
                    "legacy"
                ]

            }

        };


        /* -------------------------------------------------
           Generate PDF directly from live preview
        ------------------------------------------------- */

        await html2pdf()

            .set(options)

            .from(resume)

            .toPdf()

            .get("pdf")

            .then(
                pdf => {

                    const totalPages =
                        pdf.internal
                            .getNumberOfPages();


                    for (
                        let page = 1;
                        page <= totalPages;
                        page++
                    ) {

                        pdf.setPage(page);

                    }

                }
            )

            .save();


    }


    catch (error) {

        console.error(
            "PDF generation error:",
            error
        );


        alert(
            "Unable to generate the PDF. Please try again."
        );

    }


    finally {


        /* -------------------------------------------------
           Restore preview
        ------------------------------------------------- */

        resume.classList.remove(
            "pdf-generating"
        );


        /* -------------------------------------------------
           Restore buttons
        ------------------------------------------------- */

        buttons.forEach(
            (button, index) => {

                button.disabled =
                    false;

                button.innerHTML =
                    originalButtonHTML[index];

            }
        );

    }

}

}
